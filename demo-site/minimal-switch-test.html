<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>最小化 Switch 测试</title>
  <style>
    body { padding: 40px; font-family: system-ui; }
    .test-section { margin: 30px 0; padding: 20px; border: 2px solid #ddd; }
  </style>
</head>
<body>
  <h1>最小化 Switch 测试</h1>

  <!-- 测试1: 最原始的 checkbox -->
  <div class="test-section">
    <h2>测试 1: 原生 HTML Checkbox</h2>
    <input type="checkbox" id="test1" style="width: 30px; height: 30px;">
    <label for="test1">点击这个原生 checkbox（如果这个不能点，说明浏览器有问题）</label>
    <p id="status1">状态: 未选中</p>
    <script>
      document.getElementById('test1').addEventListener('change', function(e) {
        document.getElementById('status1').textContent = '状态: ' + (e.target.checked ? '已选中' : '未选中');
        console.log('原生 checkbox 改变:', e.target.checked);
      });
    </script>
  </div>

  <!-- 测试2: 带隐藏的 checkbox + label -->
  <div class="test-section">
    <h2>测试 2: 隐藏 Checkbox + Label（模拟 Switch 结构）</h2>
    <div>
      <input type="checkbox" id="test2" style="position: absolute; opacity: 0;">
      <label for="test2" style="display: inline-block; width: 50px; height: 30px; background: #ccc; border-radius: 15px; cursor: pointer; position: relative;">
        <span style="display: block; width: 26px; height: 26px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.2s;"></span>
      </label>
      <span>点击灰色区域</span>
    </div>
    <p id="status2">状态: 未选中</p>
    <script>
      const checkbox2 = document.getElementById('test2');
      const label2 = checkbox2.nextElementSibling;
      const thumb2 = label2.querySelector('span');

      checkbox2.addEventListener('change', function(e) {
        document.getElementById('status2').textContent = '状态: ' + (e.target.checked ? '已选中' : '未选中');
        console.log('隐藏 checkbox 改变:', e.target.checked);

        if (e.target.checked) {
          label2.style.background = '#3b82f6';
          thumb2.style.left = '22px';
        } else {
          label2.style.background = '#ccc';
          thumb2.style.left = '2px';
        }
      });
    </script>
  </div>

  <!-- 测试3: React Switch 组件 -->
  <div class="test-section">
    <h2>测试 3: React Switch 组件（来自源码）</h2>
    <div id="react-switch"></div>
    <p id="status3">加载中...</p>
  </div>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Switch } from '/src/components/ui/Switch';

    function TestSwitch() {
      const [count, setCount] = useState(0);

      console.log('TestSwitch 渲染, count:', count);

      return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' }}, [
        React.createElement('button', {
          key: 'btn',
          onClick: () => {
            console.log('按钮点击，强制重新渲染');
            setCount(count + 1);
          },
          style: { padding: '8px 16px', cursor: 'pointer', background: '#3b82f6', color: 'white', border: 'none', borderRadius: '4px' }
        }, '强制重新渲染 (count: ' + count + ')'),

        React.createElement('div', { key: 'switch1' }, [
          React.createElement('h4', { key: 'h4' }, '非受控 Switch:'),
          React.createElement(Switch, {
            key: 'switch',
            label: '点击这个开关',
            defaultChecked: false,
            onChange: (e) => {
              console.log('%c非受控 onChange 触发', 'color: green; font-weight: bold', e.target.checked);
              document.getElementById('status3').textContent = '非受控 onChange: ' + e.target.checked;
            },
            onCheckedChange: (checked) => {
              console.log('%c非受控 onCheckedChange 触发', 'color: blue; font-weight: bold', checked);
            }
          })
        ]),

        React.createElement('div', { key: 'switch2', style: { marginTop: '20px' }}, [
          React.createElement('h4', { key: 'h4' }, '无 label 的 Switch:'),
          React.createElement(Switch, {
            key: 'switch',
            defaultChecked: false,
            onChange: (e) => {
              console.log('%c无label onChange', 'color: orange; font-weight: bold', e.target.checked);
            }
          })
        ])
      ]);
    }

    const root = createRoot(document.getElementById('react-switch'));
    root.render(React.createElement(TestSwitch));

    document.getElementById('status3').textContent = 'React Switch 已加载，请尝试点击';

    // 调试函数
    window.checkSwitches = () => {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      console.log('=== 所有 Checkbox 状态 ===');
      checkboxes.forEach((cb, i) => {
        console.log(`Checkbox ${i}:`, {
          id: cb.id,
          checked: cb.checked,
          disabled: cb.disabled,
          className: cb.className,
          style: cb.style.cssText,
          parent: cb.parentElement.tagName
        });
      });

      const labels = document.querySelectorAll('label');
      console.log('=== 所有 Label ===');
      labels.forEach((label, i) => {
        console.log(`Label ${i}:`, {
          htmlFor: label.htmlFor,
          className: label.className,
          hasClickHandler: label.onclick !== null,
          computedStyle: window.getComputedStyle(label).pointerEvents
        });
      });
    };

    console.log('%c调试提示:', 'color: red; font-size: 16px; font-weight: bold');
    console.log('1. 测试 1 和测试 2 如果能点击，说明浏览器正常');
    console.log('2. 如果测试 3 不能点击，说明 React Switch 组件有问题');
    console.log('3. 在控制台运行 checkSwitches() 查看详细状态');
    console.log('4. 点击时观察是否有日志输出');
  </script>
</body>
</html>
