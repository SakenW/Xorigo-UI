<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple React Switch</title>
  <style>
    body { padding: 40px; }
  </style>
</head>
<body>
  <h1>极简 React Switch 测试</h1>
  <div id="root"></div>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';

    // 极简 Switch 实现（无 Framer Motion）
    function SimpleSwitch({ label, defaultChecked = false }) {
      const [checked, setChecked] = useState(defaultChecked);
      const id = 'simple-switch';

      console.log('SimpleSwitch 渲染, checked:', checked);

      return React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '20px', border: '2px solid #ddd', borderRadius: '8px' }}, [
        React.createElement('input', {
          key: 'input',
          type: 'checkbox',
          id: id,
          checked: checked,
          onChange: (e) => {
            console.log('%c点击了！', 'color: green; font-size: 20px; font-weight: bold', e.target.checked);
            setChecked(e.target.checked);
          },
          style: { position: 'absolute', opacity: 0 }
        }),
        React.createElement('label', {
          key: 'label',
          htmlFor: id,
          style: {
            position: 'relative',
            display: 'inline-block',
            width: '44px',
            height: '24px',
            background: checked ? '#3b82f6' : '#d1d5db',
            borderRadius: '12px',
            cursor: 'pointer',
            transition: 'background 0.2s'
          }
        }, React.createElement('span', {
          style: {
            position: 'absolute',
            top: '2px',
            left: checked ? '22px' : '2px',
            width: '20px',
            height: '20px',
            background: 'white',
            borderRadius: '50%',
            transition: 'left 0.2s'
          }
        })),
        React.createElement('label', {
          key: 'text',
          htmlFor: id,
          style: { cursor: 'pointer', userSelect: 'none' }
        }, label || '点击切换')
      ]);
    }

    function App() {
      return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '20px' }}, [
        React.createElement('h2', { key: 'h2' }, '这是一个不使用任何库的极简 Switch'),
        React.createElement(SimpleSwitch, { key: 'switch1', label: '开关 1' }),
        React.createElement(SimpleSwitch, { key: 'switch2', label: '开关 2', defaultChecked: true }),
        React.createElement('p', { key: 'tip', style: { color: '#666', fontSize: '14px' }},
          '如果这个能点击，说明 React 基础功能正常。如果不能点击，说明有更深层的问题。')
      ]);
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));

    console.log('%c测试说明:', 'color: blue; font-size: 16px');
    console.log('这是一个最简单的 React Switch，不使用 Framer Motion');
    console.log('如果这个能工作，说明问题在于 Framer Motion 或其他依赖');
  </script>
</body>
</html>
