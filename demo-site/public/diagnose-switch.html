<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch 诊断页面</title>
  <style>
    body {
      font-family: system-ui;
      padding: 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { font-size: 32px; color: #1a202c; margin-bottom: 10px; }
    .subtitle { color: #718096; margin-bottom: 30px; }
    .section {
      margin: 30px 0;
      padding: 24px;
      background: #f7fafc;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 16px;
    }
    .log {
      background: #1a202c;
      color: #48bb78;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 500px;
      overflow-y: auto;
      margin-top: 16px;
    }
    .log-line { margin: 4px 0; }
    .log-error { color: #f56565; }
    .log-success { color: #48bb78; }
    .log-info { color: #4299e1; }
    .log-warn { color: #f6ad55; }
    .btn {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
      margin: 8px 8px 8px 0;
    }
    .btn:hover { background: #5a67d8; }
    .highlight {
      background: #fef5e7;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #f6ad55;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Switch 组件诊断页面</h1>
    <p class="subtitle">深度诊断 TH-UI Switch 组件的点击问题</p>

    <div class="highlight">
      <strong>⚠️ 请按以下步骤操作：</strong>
      <ol style="margin-left: 20px; margin-top: 8px; line-height: 1.8;">
        <li>尝试点击下方的每个 Switch 开关</li>
        <li>观察是否能够切换状态</li>
        <li>查看实时日志中的事件信息</li>
        <li>点击"DOM 检查"按钮查看元素状态</li>
      </ol>
    </div>

    <div class="section">
      <div class="section-title">🎯 Switch 组件测试区</div>
      <div id="switch-container" style="padding: 20px; background: white; border-radius: 8px;"></div>

      <button class="btn" onclick="inspectDOM()">🔍 DOM 检查</button>
      <button class="btn" onclick="forceToggle()">⚡ 强制切换第一个 Switch</button>
      <button class="btn" onclick="clearLogs()">🗑️ 清空日志</button>
    </div>

    <div class="section">
      <div class="section-title">📊 实时事件日志</div>
      <div class="log" id="logs"></div>
    </div>
  </div>

  <script>
    function log(message, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-line log-${type}`;
      div.textContent = `[${time}] ${message}`;
      const logsDiv = document.getElementById('logs');
      logsDiv.insertBefore(div, logsDiv.firstChild);
      console.log(message);
    }

    function inspectDOM() {
      log('=== DOM 检查开始 ===', 'warn');
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      log(`找到 ${checkboxes.length} 个 checkbox`, 'info');

      checkboxes.forEach((cb, i) => {
        log(`Checkbox ${i + 1}:`, 'info');
        log(`  - checked: ${cb.checked}`, cb.checked ? 'success' : 'error');
        log(`  - disabled: ${cb.disabled}`, cb.disabled ? 'error' : 'success');
        log(`  - id: ${cb.id}`, 'info');
        log(`  - className: ${cb.className}`, 'info');

        // 检查父元素
        const label = cb.closest('label');
        if (label) {
          const computedStyle = window.getComputedStyle(label);
          log(`  - label cursor: ${computedStyle.cursor}`, 'info');
          log(`  - label pointer-events: ${computedStyle.pointerEvents}`, 'info');
        }
      });
    }

    function forceToggle() {
      const firstCheckbox = document.querySelector('input[type="checkbox"]');
      if (firstCheckbox) {
        firstCheckbox.checked = !firstCheckbox.checked;
        log(`强制切换第一个 Switch 为: ${firstCheckbox.checked ? '开启' : '关闭'}`, 'warn');
        firstCheckbox.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }

    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
      log('日志已清空', 'info');
    }

    // 捕获所有点击事件
    document.addEventListener('click', function(e) {
      log(`点击事件: ${e.target.tagName} (${e.target.className})`, 'info');
    }, true);

    log('✅ 诊断页面已加载', 'success');
    log('等待 Switch 组件加载...', 'info');
  </script>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Switch } from '../../src/components/ui/Switch';

    function TestSwitches() {
      const [controlled, setControlled] = React.useState(false);

      React.useEffect(() => {
        log('✅ Switch 组件已挂载到 DOM', 'success');

        // 等待 DOM 更新后检查
        setTimeout(() => {
          const checkboxes = document.querySelectorAll('input[type="checkbox"]');
          log(`DOM 中发现 ${checkboxes.length} 个 checkbox 元素`, 'success');

          // 为每个 checkbox 添加事件监听
          checkboxes.forEach((cb, i) => {
            cb.addEventListener('change', function(e) {
              log(`✓ Checkbox ${i + 1} onChange: ${this.checked}`, this.checked ? 'success' : 'error');
            });

            cb.addEventListener('click', function(e) {
              log(`  Checkbox ${i + 1} click 事件`, 'info');
            });

            // 检查 label 关联
            const label = document.querySelector(`label[for="${cb.id}"]`);
            if (label) {
              log(`  Checkbox ${i + 1} 关联的 label 数量: ${document.querySelectorAll(`label[for="${cb.id}"]`).length}`, 'info');
            }
          });
        }, 500);
      }, []);

      return React.createElement('div', {
        style: { display: 'flex', flexDirection: 'column', gap: '20px' }
      }, [
        React.createElement(Switch, {
          key: '1',
          label: 'Switch 1 - 非受控（默认关闭）',
          description: '应该可以点击切换',
          variant: 'primary',
          onChange: (e) => log(`Switch 1 onChange 回调: ${e.target.checked}`, 'success'),
          onCheckedChange: (checked) => log(`Switch 1 onCheckedChange 回调: ${checked}`, 'success')
        }),

        React.createElement(Switch, {
          key: '2',
          label: 'Switch 2 - 非受控（默认开启）',
          description: '使用 defaultChecked={true}',
          variant: 'success',
          defaultChecked: true,
          onChange: (e) => log(`Switch 2 onChange 回调: ${e.target.checked}`, 'success'),
          onCheckedChange: (checked) => log(`Switch 2 onCheckedChange 回调: ${checked}`, 'success')
        }),

        React.createElement(Switch, {
          key: '3',
          label: 'Switch 3 - 受控模式',
          description: '使用 React 状态控制',
          variant: 'danger',
          checked: controlled,
          onCheckedChange: (checked) => {
            log(`Switch 3 状态更新: ${checked}`, 'success');
            setControlled(checked);
          }
        })
      ]);
    }

    const root = createRoot(document.getElementById('switch-container'));
    root.render(React.createElement(TestSwitches));

    log('✅ Switch 组件开始渲染', 'success');
  </script>
</body>
</html>
