<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS v4 测试</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-600 mb-8">Tailwind CSS v4 测试页面</h1>

        <!-- 测试基础样式 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">基础样式测试</h2>
            <p class="text-gray-700 mb-4">这是一个测试段落，应该显示为灰色文字。</p>

            <!-- 测试按钮 -->
            <div class="flex gap-4 mb-4">
                <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    蓝色按钮
                </button>
                <button class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    红色按钮
                </button>
                <button class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    绿色按钮
                </button>
            </div>

            <!-- 测试卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-50 p-4 border border-gray-200 rounded">
                    <h3 class="font-semibold text-gray-900 mb-2">卡片 1</h3>
                    <p class="text-sm text-gray-600">这是一个测试卡片。</p>
                </div>
                <div class="bg-blue-50 p-4 border border-blue-200 rounded">
                    <h3 class="font-semibold text-blue-900 mb-2">卡片 2</h3>
                    <p class="text-sm text-blue-600">这是一个蓝色主题卡片。</p>
                </div>
                <div class="bg-green-50 p-4 border border-green-200 rounded">
                    <h3 class="font-semibold text-green-900 mb-2">卡片 3</h3>
                    <p class="text-sm text-green-600">这是一个绿色主题卡片。</p>
                </div>
            </div>
        </div>

        <!-- 测试自定义颜色 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">自定义颜色测试</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="p-4 rounded" style="background-color: var(--color-primary);">
                    <p class="text-white font-semibold">Primary Color</p>
                </div>
                <div class="p-4 rounded" style="background-color: var(--color-secondary);">
                    <p class="text-white font-semibold">Secondary Color</p>
                </div>
                <div class="p-4 rounded" style="background-color: var(--color-success);">
                    <p class="text-white font-semibold">Success Color</p>
                </div>
                <div class="p-4 rounded" style="background-color: var(--color-danger);">
                    <p class="text-white font-semibold">Danger Color</p>
                </div>
            </div>
        </div>

        <!-- 测试Tailwind v4 新特性 -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Tailwind v4 新特性测试</h2>
            <div class="space-y-4">
                <div class="p-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded">
                    <p>渐变背景测试</p>
                </div>
                <div class="p-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 transition-colors">
                    <p>边框和过渡效果测试</p>
                </div>
                <div class="p-4 bg-gray-100 dark:bg-gray-800 rounded">
                    <p class="text-gray-800 dark:text-gray-200">深色模式测试</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
