# ============================================
# Xorigo UI 生产环境虚拟主机配置 - Phase 6 优化版
# 零停机部署 + 性能监控 + 缓存优化
# ============================================

server {
    listen 3100;
    server_name localhost ${DOMAIN:-xorigo-ui.local};
    root /usr/share/nginx/html;
    index index.html;

    # 日志配置
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;

    # 连接限制
    limit_conn addr 20;

    # 健康检查端点 - 不记录日志
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # API 健康检查
    location = /api/health {
        proxy_pass http://xorigo_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        limit_req zone=api burst=20 nodelay;
    }

    # Core Web Vitals 监控端点
    location = /api/web-vitals {
        proxy_pass http://xorigo_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api burst=10 nodelay;
    }

    # 性能指标端点
    location = /api/metrics {
        proxy_pass http://xorigo_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api burst=5 nodelay;

        # 仅允许内部访问
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        allow 172.21.0.0/16;
        allow 172.22.0.0/16;
        deny all;
    }

    # 静态资源优化 - JS/CSS
    location ~* \.(js|css|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";

        # 启用 Brotli 压缩（如果可用）
        # brotli on;
        # brotli_comp_level 6;

        # Gzip 压缩
        gzip_static on;

        # 安全头
        add_header X-Content-Type-Options "nosniff" always;

        access_log off;
        try_files $uri =404;
    }

    # 静态资源优化 - 图片
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";

        # 图片压缩优化
        gzip_static on;

        # 安全头
        add_header X-Content-Type-Options "nosniff" always;

        access_log off;
        try_files $uri =404;
    }

    # 静态资源优化 - 字体
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";

        access_log off;
        try_files $uri =404;
    }

    # 页面资源 - HTML
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";

        # Gzip 压缩
        gzip_static on;

        # 安全头
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        try_files $uri =404;
    }

    # Next.js 静态资源
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # 静态文件直接服务，不代理到后端
        try_files $uri =404;
        access_log off;
    }

    # API 路由代理
    location /api/ {
        proxy_pass http://xorigo_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时配置
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 速率限制
        limit_req zone=api burst=20 nodelay;
    }

    # SPA 路由支持 - 零停机部署优化
    location / {
        # 健康检查和版本标识
        try_files /health.html $uri $uri/ /index.html;

        # 防止缓存 HTML 文件
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # 速率限制
        limit_req zone=general burst=40 nodelay;
    }

    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # 安全配置 - 禁止访问敏感文件
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问配置文件
    location ~* \.(conf|config|ini|log|sh|sql|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 监控和统计页面（仅限内网）
    location = /nginx_status {
        stub_status on;
        access_log off;

        # 仅允许内网访问
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        allow 172.21.0.0/16;
        allow 172.22.0.0/16;
        deny all;
    }
}