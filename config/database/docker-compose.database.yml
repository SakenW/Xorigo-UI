# Xorigo UI Database Services
# PostgreSQL + Redis for collaboration and sharing features

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xorigo-ui-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-xorigo_ui}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    networks:
      - xorigo-db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-xorigo_ui}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.xorigo-ui.service=postgres"
      - "com.xorigo-ui.environment=development"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: xorigo-ui-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - xorigo-db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.xorigo-ui.service=redis"
      - "com.xorigo-ui.environment=development"

  # Database Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: xorigo-ui-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@xorigo-ui.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - xorigo-db-network
    restart: unless-stopped
    depends_on:
      - postgres
    labels:
      - "com.xorigo-ui.service=pgadmin"
      - "com.xorigo-ui.environment=development"

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: xorigo-ui-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis123}
      HTTP_USER: ${REDIS_ADMIN_USER:-admin}
      HTTP_PASSWORD: ${REDIS_ADMIN_PASSWORD:-admin123}
    ports:
      - "${REDIS Commander_PORT:-8081}:8081"
    networks:
      - xorigo-db-network
    restart: unless-stopped
    depends_on:
      - redis
    labels:
      - "com.xorigo-ui.service=redis-commander"
      - "com.xorigo-ui.environment=development"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  xorigo-db-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
