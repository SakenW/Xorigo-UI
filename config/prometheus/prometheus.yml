# ============================================
# Xorigo UI Prometheus 监控配置 - Phase 6
# 应用性能监控 + 系统指标 + Core Web Vitals
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'xorigo-ui-monitor'
    environment: 'production'

# 规则文件
rule_files:
  - "rules/*.yml"

# 警报管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: '/metrics'
    honor_labels: true

  # Nginx 监控（需要 nginx-prometheus-exporter）
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s
    metrics_path: '/metrics'
    honor_labels: true

  # Node Exporter 系统指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: '/metrics'
    honor_labels: true

  # cAdvisor 容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: '/metrics'
    honor_labels: true

  # Redis 监控（需要 redis-exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
    metrics_path: '/metrics'
    honor_labels: true

  # Xorigo UI 应用监控
  - job_name: 'xorigo-ui-app'
    static_configs:
      - targets: ['xorigo-ui-website:3100']
    scrape_interval: 15s
    metrics_path: '/api/metrics'
    honor_labels: true
    scrape_timeout: 10s
    params:
      format: ['prometheus']

  # 网站可用性监控
  - job_name: 'website-uptime'
    static_configs:
      - targets: ['xorigo-ui-website:3100']
    metrics_path: '/health'
    scrape_interval: 30s
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        target_label: __name__
        replacement: 'website_up'

  # Core Web Vitals 监控
  - job_name: 'web-vitals'
    static_configs:
      - targets: ['xorigo-ui-website:3100']
    scrape_interval: 60s
    metrics_path: '/api/web-vitals'
    honor_labels: true
    scrape_timeout: 5s

  # Blackbox 网站探测（需要 blackbox-exporter）
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://xorigo-ui-website:3100
        - https://xorigo-ui.com  # 生产域名
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# 存储配置
storage:
  tsdb:
    path: /prometheus
    retention.time: 30d
    retention.size: 10GB