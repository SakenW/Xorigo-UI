# ============================================
# Xorigo UI Website 开发环境编排
# Next.js 15 Dev Server with Hot Reload
# ============================================
version: '3.8'

services:
  th-ui-website:
    image: th-ui-website
    build:
      context: ./apps/website
      dockerfile: Dockerfile.dev
    container_name: th-ui-website
    ports:
      - "3100:3100"
    volumes:
      # 源码映射（支持热更新）
      - ./apps/website/src:/app/src
      - ./apps/website/public:/app/public
      - ./apps/website/next.config.ts:/app/next.config.ts
      - ./apps/website/tailwind.config.ts:/app/tailwind.config.ts
      - ./apps/website/tsconfig.json:/app/tsconfig.json
      - ./apps/website/package.json:/app/package.json

      # Xorigo UI 组件库挂载（使用构建后的 dist 目录）
      - ./packages/core/dist:/app/node_modules/@xorigo-ui/core/dist:ro
      - ./packages/core/package.json:/app/node_modules/@xorigo-ui/core/package.json:ro
      - ./packages/registry/dist:/app/node_modules/@xorigo-ui/registry/dist:ro
      - ./packages/registry/package.json:/app/node_modules/@xorigo-ui/registry/package.json:ro
      - ./packages/tokens:/app/node_modules/@xorigo-ui/tokens:ro
      - ./packages/style-recipe:/app/node_modules/@xorigo-ui/style-recipe:ro

      # 清理缓存目录（避免缓存冲突）
      - /app/.next
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev -- --port 3100 --hostname 0.0.0.0
    networks:
      - th-ui-network
    restart: unless-stopped

networks:
  th-ui-network:
    driver: bridge
