services:
  th-ui-website:
    build:
      context: ./apps/website
      dockerfile: Dockerfile.dev
    container_name: th-ui-website
    ports:
      - "3100:3100"  # Next.js dev server port 3100 mapped to host 3100
    volumes:
      - ./apps/website/src/app:/app/app
      - ./apps/website/src:/app/src
      - .:/app/th-ui  # TH-UI 组件库挂载到独立目录
      - ./apps/website/public:/app/public
      - ./apps/website/next.config.ts:/app/next.config.ts
      - ./apps/website/tailwind.config.ts:/app/tailwind.config.ts
      - ./apps/website/tsconfig.json:/app/tsconfig.json
      - ./apps/website/package.json:/app/package.json
    environment:
      - NODE_ENV=development
    command: npm run dev -- --port 3100 --hostname 0.0.0.0
    networks:
      - th-ui-network

networks:
  th-ui-network:
    driver: bridge