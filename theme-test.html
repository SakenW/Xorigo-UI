<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题切换测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--theme-bg-primary, #ffffff);
            color: var(--theme-text-primary, #0f172a);
            transition: all 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: var(--theme-gradient, linear-gradient(135deg, #3b82f6 0%, #2563eb 100%));
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: var(--theme-glow, rgba(59, 130, 246, 0.3)) 0 4px 20px;
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .theme-btn {
            background: var(--theme-primary, #3b82f6);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            background: var(--theme-secondary, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--theme-glow, rgba(59, 130, 246, 0.3));
        }

        .theme-btn:active {
            transform: translateY(0);
        }

        .card {
            background: var(--theme-bg-secondary, #f8fafc);
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .card h3 {
            color: var(--theme-primary, #3b82f6);
            margin: 0 0 0.5rem 0;
        }

        .status {
            background: var(--theme-accent, #60a5fa);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .css-variables {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Xorigo UI 主题切换测试</h1>
            <p>测试24个主题配方的切换效果</p>
        </div>

        <div class="status" id="status">当前主题: corporate-blue</div>

        <div class="theme-buttons">
            <button class="theme-btn" onclick="applyTheme('corporate-blue')">企业蓝</button>
            <button class="theme-btn" onclick="applyTheme('minimal-white')">极简白</button>
            <button class="theme-btn" onclick="applyTheme('tech-cyan')">科技青</button>
            <button class="theme-btn" onclick="applyTheme('creative-purple')">创意紫</button>
            <button class="theme-btn" onclick="applyTheme('nature-green')">自然绿</button>
            <button class="theme-btn" onclick="applyTheme('warm-sunset')">温暖日落</button>
            <button class="theme-btn" onclick="applyTheme('ocean-blue')">海洋蓝</button>
            <button class="theme-btn" onclick="applyTheme('garden-floral')">花园花卉</button>
            <button class="theme-btn" onclick="applyTheme('urban-modern')">都市现代</button>
            <button class="theme-btn" onclick="applyTheme('art-vibrant')">艺术活力</button>
            <button class="theme-btn" onclick="applyTheme('future-chrome')">未来铬金</button>
            <button class="theme-btn" onclick="applyTheme('corporate-navy-dark')">企业深蓝</button>
            <button class="theme-btn" onclick="applyTheme('minimal-graphite-dark')">极简石墨黑</button>
            <button class="theme-btn" onclick="applyTheme('tech-neon-dark')">科技霓虹黑</button>
            <button class="theme-btn" onclick="applyTheme('creative-aurora-dark')">创意极光黑</button>
            <button class="theme-btn" onclick="applyTheme('nature-forest-dark')">森林深绿</button>
            <button class="theme-btn" onclick="applyTheme('warm-fire-dark')">温暖火焰黑</button>
            <button class="theme-btn" onclick="applyTheme('ocean-deep-dark')">深海蓝黑</button>
            <button class="theme-btn" onclick="applyTheme('garden-midnight')">午夜花园</button>
            <button class="theme-btn" onclick="applyTheme('urban-night-dark')">都市夜景黑</button>
            <button class="theme-btn" onclick="applyTheme('art-gallery-dark')">艺术画廊黑</button>
            <button class="theme-btn" onclick="applyTheme('future-cyber-dark')">未来赛博黑</button>
        </div>

        <div class="card">
            <h3>主题预览</h3>
            <p>这里显示主题的颜色效果。主题切换应该立即生效，包括背景色、文字色、按钮色和渐变效果。</p>
            <p>当前使用的是 <strong id="theme-name">Corporate Blue</strong> 主题。</p>
        </div>

        <div class="card">
            <h3>CSS 变量状态</h3>
            <div class="css-variables" id="css-vars">正在检测CSS变量...</div>
        </div>
    </div>

    <script>
        // 模拟 ThemeRecipeManager 的简化版本
        const themeColors = {
            'corporate-blue': {
                '--theme-primary': '#3b82f6',
                '--theme-secondary': '#2563eb',
                '--theme-accent': '#60a5fa',
                '--theme-gradient': 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)',
                '--theme-glow': 'rgba(59, 130, 246, 0.3)',
            },
            'minimal-white': {
                '--theme-primary': '#64748b',
                '--theme-secondary': '#475569',
                '--theme-accent': '#94a3b8',
                '--theme-gradient': 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)',
                '--theme-glow': 'rgba(148, 163, 184, 0.2)',
            },
            'tech-cyan': {
                '--theme-primary': '#06b6d4',
                '--theme-secondary': '#0891b2',
                '--theme-accent': '#67e8f9',
                '--theme-gradient': 'linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)',
                '--theme-glow': 'rgba(6, 182, 212, 0.3)',
            },
            'creative-purple': {
                '--theme-primary': '#a855f7',
                '--theme-secondary': '#9333ea',
                '--theme-accent': '#c084fc',
                '--theme-gradient': 'linear-gradient(135deg, #a855f7 0%, #ec4899 100%)',
                '--theme-glow': 'rgba(168, 85, 247, 0.3)',
            },
            'nature-green': {
                '--theme-primary': '#22c55e',
                '--theme-secondary': '#16a34a',
                '--theme-accent': '#86efac',
                '--theme-gradient': 'linear-gradient(135deg, #22c55e 0%, #84cc16 100%)',
                '--theme-glow': 'rgba(34, 197, 94, 0.3)',
            },
            'warm-sunset': {
                '--theme-primary': '#f97316',
                '--theme-secondary': '#ea580c',
                '--theme-accent': '#fb923c',
                '--theme-gradient': 'linear-gradient(135deg, #f97316 0%, #ef4444 100%)',
                '--theme-glow': 'rgba(249, 115, 22, 0.3)',
            },
            'ocean-blue': {
                '--theme-primary': '#0ea5e9',
                '--theme-secondary': '#0284c7',
                '--theme-accent': '#38bdf8',
                '--theme-gradient': 'linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%)',
                '--theme-glow': 'rgba(14, 165, 233, 0.3)',
            },
            'garden-floral': {
                '--theme-primary': '#ec4899',
                '--theme-secondary': '#db2777',
                '--theme-accent': '#f9a8d4',
                '--theme-gradient': 'linear-gradient(135deg, #ec4899 0%, #a855f7 100%)',
                '--theme-glow': 'rgba(236, 72, 153, 0.3)',
            },
            'urban-modern': {
                '--theme-primary': '#6b7280',
                '--theme-secondary': '#4b5563',
                '--theme-accent': '#9ca3af',
                '--theme-gradient': 'linear-gradient(135deg, #6b7280 0%, #eab308 100%)',
                '--theme-glow': 'rgba(107, 114, 128, 0.3)',
            },
            'art-vibrant': {
                '--theme-primary': '#ef4444',
                '--theme-secondary': '#dc2626',
                '--theme-accent': '#f87171',
                '--theme-gradient': 'linear-gradient(135deg, #ef4444 0%, #eab308 0%, #3b82f6 50%)',
                '--theme-glow': 'rgba(239, 68, 68, 0.3)',
            },
            'future-chrome': {
                '--theme-primary': '#94a3b8',
                '--theme-secondary': '#64748b',
                '--theme-accent': '#cbd5e1',
                '--theme-gradient': 'linear-gradient(135deg, #94a3b8 0%, #3b82f6 100%)',
                '--theme-glow': 'rgba(192, 192, 192, 0.4)',
            },
        };

        const darkThemes = [
            'corporate-navy-dark', 'minimal-graphite-dark', 'tech-neon-dark',
            'creative-aurora-dark', 'nature-forest-dark', 'warm-fire-dark',
            'ocean-deep-dark', 'garden-midnight', 'urban-night-dark',
            'art-gallery-dark', 'future-cyber-dark'
        ];

        function applyTheme(themeId) {
            console.log(`应用主题: ${themeId}`);

            // 获取基础主题颜色
            const baseThemeId = themeId.replace('-dark', '');
            const colors = themeColors[baseThemeId] || themeColors['corporate-blue'];

            // 应用主题颜色
            if (colors) {
                Object.entries(colors).forEach(([key, value]) => {
                    document.documentElement.style.setProperty(key, value);
                });
            }

            // 应用深色/浅色基础设置
            if (darkThemes.includes(themeId)) {
                document.documentElement.style.setProperty('--theme-bg-primary', '#0f172a');
                document.documentElement.style.setProperty('--theme-bg-secondary', '#1e293b');
                document.documentElement.style.setProperty('--theme-text-primary', '#f8fafc');
                document.documentElement.style.setProperty('--theme-text-secondary', '#cbd5e1');
            } else {
                document.documentElement.style.setProperty('--theme-bg-primary', '#ffffff');
                document.documentElement.style.setProperty('--theme-bg-secondary', '#f8fafc');
                document.documentElement.style.setProperty('--theme-text-primary', '#0f172a');
                document.documentElement.style.setProperty('--theme-text-secondary', '#475569');
            }

            // 更新状态显示
            document.getElementById('status').textContent = `当前主题: ${themeId}`;
            const themeName = themeId.split('-').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
            document.getElementById('theme-name').textContent = themeName;

            // 更新CSS变量显示
            updateCSSVariablesDisplay();
        }

        function updateCSSVariablesDisplay() {
            const variables = [
                '--theme-primary',
                '--theme-secondary',
                '--theme-accent',
                '--theme-bg-primary',
                '--theme-bg-secondary',
                '--theme-text-primary',
                '--theme-text-secondary'
            ];

            const cssVars = variables.map(varName => {
                const value = getComputedStyle(document.documentElement)
                    .getPropertyValue(varName).trim();
                return `${varName}: ${value || '未设置'}`;
            }).join('\n');

            document.getElementById('css-vars').textContent = cssVars;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme('corporate-blue');
        });
    </script>
</body>
</html>
