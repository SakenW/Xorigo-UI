# ============================================
# TH-UI Website 生产环境编排
# Next.js 15 Production with Health Check
# ============================================
version: '3.8'

services:
  th-ui-website:
    container_name: th-ui-website-prod
    build:
      context: ./apps/website
      dockerfile: Dockerfile
    ports:
      - "${PROD_PORT:-3100}:3100"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3100
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    networks:
      - th-ui-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.th-ui.service=website"
      - "com.th-ui.environment=production"
      - "com.th-ui.version=0.1.0"

networks:
  th-ui-network:
    driver: bridge
