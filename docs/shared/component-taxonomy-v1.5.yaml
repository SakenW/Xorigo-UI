library: Xorigo UI
versioning: semver
version: "1.5.0"
description: "Xorigo UI 组件库分类架构 - v1.5.0 Final（三层结构 + 十一类组件 + 稳定性标签）"

architecture:
  name: "Three-Layer + Eleven-Category + Stability Labels"
  total_categories: 17
  design_principles:
    - "对齐行业共识：与 Antd / MUI / Chakra / Mantine 高度对齐"
    - "兼容现代组件库：支持 Primitives / Blocks / Labs 体系"
    - "清晰边界划分：每类组件有明确的职责边界"
    - "稳定性和成熟度：横跨所有分类的稳定性标签"
    - "可扩展性：支持未来组件增长和新功能扩展"

# 横向维度（横跨所有分类）
stability_levels:
  stable: "生产就绪，API稳定，向后兼容"
  beta: "功能基本完成，可能有小的调整"
  labs: "实验性功能，API可能变化，不保证稳定性"

component_levels:
  system: "系统能力层（无需归类到 primitive/component/block）"
  primitive: "原子级组件基元，高复用性"
  component: "完整的功能组件"
  block: "组合区块，业务场景拼装"

categories:
  # === System Layer / 系统层 ===
  - id: foundations
    title: Foundations · 设计基础
    description: "静态设计令牌与基础样式，只放常量/tokens，不放组件"
    layer: system
    level: primitive
    items:
      - color-system          # 颜色体系、语义色、状态色
      - typography-system     # 字体族、字号、行高、字重
      - spacing-system        # 间距刻度、栅格基线
      - radius-system         # 圆角体系
      - shadow-system         # 阴影层级
      - motion-effects-tokens # 动效时长、缓动曲线、模糊/光晕等视觉特效 token
      - z-index-system        # 层级体系
      - icon-system           # 图标网格、线宽、尺寸等级

  - id: system
    title: System · 系统能力
    description: "跨组件机制，支撑所有组件，不直接给UI"
    layer: system
    level: system
    items:
      - theming-engine        # 主题系统、多品牌皮肤、动态主题加载
      - breakpoints-responsive # 断点定义、响应式工具（hiddenAt, showAt）
      - color-modes           # 浅色/深色/高对比模式
      - accessibility-system  # 聚焦管理、ARIA辅助、跳转链接（SkipNav）
      - internationalization  # 文案方向、数字/日期格式配置
      - direction-rtl         # 左右书写方向支持

  - id: primitives
    title: Primitives · 原子级组件
    description: "少而精，高复用、跨大量组件的「砖」"
    layer: system
    level: primitive
    items:
      - box                   # 基础容器
      - surface               # 表面容器
      - flex                  # 弹性布局
      - stack                 # 堆叠布局
      - grid                  # 网格布局
      - inline                # 行内布局
      - spacer                # 间距
      - text                  # 文本基元
      - heading               # 标题基元
      - visually-hidden       # 屏幕阅读器专用
      - button-base           # 按钮基元
      - input-base            # 输入基元
      - clickable             # 可点击区域
      - pressable             # 可按压区域
      - overlay-base          # 浮层基元
      - portal                # 传送门
      - dismissable-layer     # 可关闭层
      - scroll-area-base      # 滚动区域基元

  # === Component Layer / 组件层 ===
  - id: layout
    title: Layout · 布局
    description: "页面级布局和容器组件"
    layer: component
    level: component
    items:
      - container             # 页面容器
      - page-container        # 页面级容器
      - simple-grid           # 简单网格
      - wrap                  # 换行容器
      - split-view            # 可调面板
      - resizable-panel       # 可调整大小面板
      - space                 # 间距组件
      - gap                   # 间隔组件
      - divider               # 分割线
      - app-layout            # 基本页面骨架（只管布局，不含业务导航）

  - id: navigation
    title: Navigation · 导航
    description: "页面导航和路由相关组件"
    layer: component
    level: component
    items:
      - navbar                # 顶部导航栏
      - topbar                # 顶部工具栏
      - sidebar               # 侧边栏
      - sidenav               # 侧边导航
      - app-shell             # Layout + Navigation 的壳层
      - tabs                  # 标签页
      - segmented-control     # 分段控制器
      - menu                  # 菜单
      - nav-menu              # 导航菜单
      - contextual-menu       # 上下文菜单
      - breadcrumb            # 面包屑
      - pagination            # 分页
      - stepper               # 流程步骤导航
      - nav-link              # 导航链接
      - link                  # 链接
      - skip-nav              # 可访问性导航

  - id: inputs
    title: Inputs & Controls · 输入与控制
    description: "能改变状态或提交数据的可交互控件本体"
    layer: component
    level: component
    items:
      - button                # 按钮
      - icon-button           # 图标按钮
      - button-group          # 按钮组
      - input                 # 文本输入
      - textarea              # 多行文本
      - number-input          # 数字输入
      - search-input          # 搜索输入
      - select                # 选择器
      - combobox              # 组合框
      - autocomplete          # 自动完成
      - checkbox              # 复选框
      - checkbox-group        # 复选框组
      - radio                 # 单选框
      - radio-group           # 单选框组
      - switch                # 开关
      - toggle                # 切换
      - slider                # 滑块
      - range-slider          # 范围滑块
      - rating                # 评分
      - color-picker          # 取色器
      - date-picker           # 日期选择
      - time-picker           # 时间选择
      - datetime-picker       # 日期时间选择
      - file-upload           # 文件上传
      - upload-button         # 上传按钮
      - chip                  # 芯片
      - toggle-group          # 切换组（多选/单选）

  - id: forms
    title: Forms · 表单结构与校验
    description: "表单数据管理、校验逻辑、多步表单"
    layer: component
    level: component
    items:
      - form                  # 表单容器
      - form-provider         # 表单提供者
      - form-field            # 表单字段
      - form-item             # 表单项
      - field-wrapper         # 字段包装器
      - field-label           # 字段标签
      - helper-text           # 帮助文本
      - error-message         # 错误消息
      - fieldset              # 字段集
      - legend                # 字段集标题
      - form-layout           # 多列表单、对齐规则
      - form-group            # 逻辑分组
      - validation-summary    # 校验汇总
      - form-error-banner     # 表单错误横幅
      - rhf-adapter           # React Hook Form 适配
      - formik-adapter        # Formik 适配
      - zod-adapter           # Zod 适配

  - id: data-display
    title: Data Display · 数据展示
    description: "不改变数据，只负责「展示当前状态」"
    layer: component
    level: component
    items:
      - card                  # 卡片
      - statistic-card        # 统计卡片
      - badge                 # 徽章
      - tag                   # 标签
      - chip-display          # 展示型芯片
      - avatar                # 头像
      - avatar-group          # 头像组
      - list                  # 列表
      - list-item             # 列表项
      - table                 # 表格
      - data-grid             # 数据表格
      - description-list      # 描述列表
      - key-value-list        # 键值列表
      - timeline              # 时间线
      - steps                 # 步骤（展示型）
      - accordion             # 手风琴
      - collapse              # 折叠面板
      - info-tooltip          # 信息提示（不触发流程）

  - id: typography-media
    title: Typography & Media · 文本与媒体
    description: "文本内容和媒体展示组件"
    layer: component
    level: component
    items:
      - text                  # 文本
      - heading               # 标题
      - paragraph             # 段落
      - code                  # 代码
      - kbd                   # 键盘按键
      - mark                  # 标记
      - quote                 # 引用
      - highlight             # 高亮
      - inline-code           # 行内代码
      - image                 # 图片
      - responsive-image      # 响应式图片
      - aspect-ratio          # 宽高比
      - video                 # 视频
      - video-player          # 视频播放器
      - audio                 # 音频
      - audio-player          # 音频播放器
      - icon                  # 图标（也可在 Primitives 中）

  - id: charts
    title: Charts · 图表（可视化）
    description: "数据可视化图表组件"
    layer: component
    level: component
    items:
      - chart-container       # 图表容器
      - chart-area            # 图表区域
      - axis                  # 坐标轴
      - grid-lines            # 网格线
      - legend                # 图例
      - chart-tooltip         # 图表提示
      - line-chart            # 折线图
      - area-chart            # 面积图
      - bar-chart             # 柱状图
      - column-chart          # 条形图
      - pie-chart             # 饼图
      - donut-chart           # 环形图
      - radar-chart           # 雷达图
      - gauge-chart           # 仪表图
      - funnel-chart          # 漏斗图
      - heatmap               # 热力图
      - sparkline             # 迷你图
      - mini-chart            # 小图表

  - id: feedback
    title: Feedback & Status · 反馈与状态
    description: "所有 Loading 统统归这里，统一视为「状态反馈」"
    layer: component
    level: component
    items:
      - alert                 # 警告
      - inline-alert          # 行内警告
      - banner                # 横幅
      - announcement          # 公告
      - toast                 # 消息提示
      - snackbar              # 轻量级消息
      - notification          # 通知
      - result                # 结果（成功/失败/空）
      - empty-state           # 空状态
      - empty                 # 空组件
      - skeleton              # 骨架屏
      - skeleton-text         # 文本骨架屏
      - skeleton-avatar       # 头像骨架屏
      - skeleton-block        # 块级骨架屏
      - spinner               # 加载指示器
      - loader                # 加载器
      - progress              # 进度条
      - progress-bar          # 线性进度条
      - circular-progress     # 环形进度条
      - status-dot            # 状态点
      - status-badge          # 状态徽章
      - pill                  # 胶囊
      - inline-error          # 行内错误
      - form-error            # 表单错误

  - id: overlays
    title: Overlays · 浮层
    description: "覆盖当前内容、打断或补充当前流程"
    layer: component
    level: component
    items:
      - modal                 # 模态框
      - dialog                # 对话框
      - confirm-dialog        # 确认对话框
      - drawer                # 抽屉
      - side-panel            # 侧边面板
      - popover               # 弹出框
      - hover-card            # 悬停卡片
      - tooltip               # 工具提示
      - context-menu          # 右键菜单
      - lightbox              # 灯箱
      - image-preview         # 图片预览
      - fullscreen-overlay    # 全屏遮罩

  - id: interactive
    title: Interactive · 高阶交互
    description: "复杂交互模式，不放简单按钮、开关"
    layer: component
    level: component
    items:
      - drag-drop-context     # 拖拽上下文
      - draggable             # 可拖拽
      - droppable             # 可放置
      - sortable-list         # 可排序列表
      - sortable-grid         # 可排序网格
      - virtual-list          # 虚拟列表
      - infinite-scroll       # 无限滚动
      - carousel              # 轮播
      - slider-carousel       # 滑动轮播（带手势/自动播放）
      - scroll-area           # 滚动区域（带滚动条定制和黏附行为）
      - command-palette       # 命令面板
      - spotlight             # 聚光灯搜索
      - quick-search          # 快速搜索
      - hotkeys               # 快捷键
      - shortcuts             # 快捷方式
      - keymap                # 键位映射
      - tour                  # 引导
      - walkthrough           # 演练
      - coachmark             # 教练标记
      - resizable             # 可调整大小
      - splitter              # 分割器
      - resize-handle         # 调整大小手柄
      - swipeable             # 可滑动
      - gesture-based         # 手势组件

  - id: utilities
    title: Utilities · 工具性组件
    description: "辅助其他组件工作，功能上不直接归某一大类"
    layer: component
    level: component
    items:
      - transition            # 过渡动画
      - collapse-transition   # 折叠过渡
      - fade                  # 淡入淡出
      - scale                 # 缩放
      - responsive            # 响应式
      - media-query           # 媒体查询
      - hide-at               # 断点隐藏
      - show-at               # 断点显示
      - error-boundary        # 错误边界
      - suspense-boundary     # Suspense 边界
      - click-away-listener   # 点击外部监听
      - outside-click-handler # 外部点击处理
      - focus-trap            # 焦点陷阱

  # === Composition Layer / 组合层 ===
  - id: blocks
    title: Blocks · 组合区块
    description: "通用场景的拼装块，不写死具体业务/品牌"
    layer: composition
    level: block
    items:
      # Marketing Blocks
      - hero-section          # 英雄区块
      - feature-section       # 特性区块
      - pricing-section       # 价格区块
      - faq-section           # 常见问题区块
      - testimonial-section   # 证言区块
      - call-to-action-section # 行动呼吁区块

      # Dashboard Blocks
      - kpi-overview          # 关键指标概览
      - stats-grid            # 统计网格
      - filter-bar            # 过滤栏
      - chart-panel           # 图表面板
      - activity-feed         # 活动信息流

      # Auth Blocks
      - auth-card             # 认证卡片
      - login-section         # 登录区块
      - register-section      # 注册区块
      - reset-password-section # 重置密码区块

  - id: templates
    title: Templates · 页面模板
    description: "页面级骨架结构，只在设计文档/示例项目中存在"
    layer: composition
    level: block
    items:
      - auth-page-template    # 认证页模板
      - landing-page-template # 落地页模板
      - dashboard-template    # 后台模板
      - wizard-template       # 向导模板

  - id: labs
    title: Labs · 实验组件
    description: "稳定性维度的实验组件，同时在对应分类和Labs专区展示"
    layer: composition
    level: component
    items:
      # 这里是动态的，所有标记为 labs 的组件都会在这里聚合
      # 示例：
      - new-date-range-picker # 新日期范围选择器（inputs + labs）
      - guided-tour           # 引导导览（interactive + labs）
      - ai-chat               # AI聊天（interactive + labs）
      - 3d-carousel          # 3D轮播（interactive + labs）

# 组件元数据示例
component_metadata_examples:
  - name: "Button"
    category: "inputs"
    level: "component"
    stability: "stable"
    tags: ["primary", "secondary", "icon", "size:sm|md|lg"]
    description: "基础按钮组件，支持多种样式和尺寸"

  - name: "Box"
    category: "primitives"
    level: "primitive"
    stability: "stable"
    tags: ["layout", "flex", "grid", "spacing"]
    description: "基础布局容器，原子级组件基元"

  - name: "HeroSection"
    category: "blocks"
    level: "block"
    stability: "beta"
    tags: ["marketing", "landing", "hero"]
    description: "营销页面主视觉区块，包含标题、描述和行动按钮"

  - name: "NewCommandPalette"
    category: "interactive"
    level: "component"
    stability: "labs"
    tags: ["search", "commands", "keyboard"]
    description: "实验性命令面板，支持快速搜索和键盘操作"

# 导出结构建议
export_structure:
  main_entry: "./packages/ui/src/index.ts"
  categorization: "directory-based"
  naming_convention: "kebab-case for files, PascalCase for components"
  metadata_format: "json/yaml per component"
  docs_generation: "auto from taxonomy.yaml"