# ============================================
# Xorigo UI - Staging Environment Configuration
# Stage 3: Modern Deployment & Monitoring System
# ============================================

version: '3.8'

# Staging network configuration
networks:
  xorigo-ui-staging-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

# Staging volumes
volumes:
  nginx-staging-logs:
    driver: local
  monitoring-staging-data:
    driver: local
  redis-staging-data:
    driver: local

services:
  # ============================================
  # Staging Core Service
  # ============================================
  xorigo-ui-core-staging:
    container_name: xorigo-ui-core-staging
    image: ghcr.io/${REPO_OWNER:-xorigo-ui}/core:${VERSION:-staging}
    ports:
      - "${STAGING_CORE_PORT:-3001}:3001"
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - LOG_LEVEL=debug
      - ENABLE_METRICS=true
      - REDIS_URL=redis://redis-staging:6379
    depends_on:
      - redis-staging
      - monitoring-staging
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.xorigo-ui.service=core-staging"
      - "com.xorigo-ui.environment=staging"
      - "com.xorigo-ui.version=${VERSION:-staging}"
      - "traefik.enable=true"
      - "traefik.http.routers.xorigo-core-staging.rule=Host(`staging-core.xorigo-ui.local`)"
      - "traefik.http.services.xorigo-core-staging.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ============================================
  # Staging Website Service
  # ============================================
  xorigo-ui-website-staging:
    container_name: xorigo-ui-website-staging
    image: ghcr.io/${REPO_OWNER:-xorigo-ui}/website:${VERSION:-staging}
    ports:
      - "${STAGING_WEBSITE_PORT:-3100}:3100"
    environment:
      - NODE_ENV=staging
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3100
      - HOSTNAME=0.0.0.0
      - LOG_LEVEL=debug
      - ENABLE_METRICS=true
      - REDIS_URL=redis://redis-staging:6379
      - ANALYTICS_ENABLED=true
      - FEATURE_FLAG_NEW_DASHBOARD=true
      - API_BASE_URL=http://xorigo-ui-core-staging:3001
    depends_on:
      - redis-staging
      - monitoring-staging
      - xorigo-ui-core-staging
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.xorigo-ui.service=website-staging"
      - "com.xorigo-ui.environment=staging"
      - "com.xorigo-ui.version=${VERSION:-staging}"
      - "traefik.enable=true"
      - "traefik.http.routers.xorigo-website-staging.rule=Host(`staging.xorigo-ui.local`)"
      - "traefik.http.services.xorigo-website-staging.loadbalancer.server.port=3100"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.25'
        reservations:
          memory: 384M
          cpus: '0.5'

  # ============================================
  # Staging Monitoring
  # ============================================
  monitoring-staging:
    container_name: xorigo-ui-monitoring-staging
    image: ghcr.io/${REPO_OWNER:-xorigo-ui}/monitoring:${VERSION:-staging}
    ports:
      - "${STAGING_MONITORING_PORT:-9090}:9090"
    environment:
      - NODE_ENV=staging
      - LOG_LEVEL=debug
      - PROMETHEUS_ENABLED=true
      - METRICS_INTERVAL=30s
      - CORE_SERVICE_URL=http://xorigo-ui-core-staging:3001
      - WEBSITE_SERVICE_URL=http://xorigo-ui-website-staging:3100
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.30
    volumes:
      - monitoring-staging-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 60s
      timeout: 3s
      retries: 2
      start_period: 10s
    labels:
      - "com.xorigo-ui.service=monitoring-staging"
      - "com.xorigo-ui.environment=staging"

  # ============================================
  # Staging Redis
  # ============================================
  redis-staging:
    container_name: xorigo-ui-redis-staging
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${STAGING_REDIS_PASSWORD:-xorigo-redis-staging-2024}
    ports:
      - "${STAGING_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-staging-data:/data
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.40
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - "com.xorigo-ui.service=redis-staging"
      - "com.xorigo-ui.environment=staging"

  # ============================================
  # Staging Nginx Reverse Proxy
  # ============================================
  nginx-staging:
    container_name: xorigo-ui-nginx-staging
    image: nginx:alpine
    ports:
      - "${STAGING_NGINX_PORT:-80}:80"
      - "${STAGING_NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-staging.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/staging:/etc/nginx/conf.d:ro
      - nginx-staging-logs:/var/log/nginx
    depends_on:
      - xorigo-ui-core-staging
      - xorigo-ui-website-staging
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.50
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - "com.xorigo-ui.service=nginx-staging"
      - "com.xorigo-ui.environment=staging"

  # ============================================
  # Staging Prometheus
  # ============================================
  prometheus-staging:
    container_name: xorigo-ui-prometheus-staging
    image: prom/prometheus:latest
    ports:
      - "${STAGING_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus-staging.yml:/etc/prometheus/prometheus.yml:ro
      - monitoring-staging-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.60
    labels:
      - "com.xorigo-ui.service=prometheus-staging"
      - "com.xorigo-ui.environment=staging"

  # ============================================
  # Staging Grafana
  # ============================================
  grafana-staging:
    container_name: xorigo-ui-grafana-staging
    image: grafana/grafana:latest
    ports:
      - "${STAGING_GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${STAGING_GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${STAGING_GRAFANA_PASSWORD:-xorigo-staging-2024}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_DOMAIN=staging.xorigo-ui.local
      - GF_SERVER_ROOT_URL=http://staging.xorigo-ui.local:3000/
    volumes:
      - monitoring-staging-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus-staging
    restart: unless-stopped
    networks:
      xorigo-ui-staging-network:
        ipv4_address: 172.22.0.70
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.xorigo-ui.service=grafana-staging"
      - "com.xorigo-ui.environment=staging"