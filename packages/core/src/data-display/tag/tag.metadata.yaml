# 最佳实践
bestPractices:
  - "使用语义化颜色表达含义"
  - "合理控制标签数量，避免界面混乱"
  - "为可选择标签提供明确的状态反馈"
  - "使用TagGroup管理多个标签的布局"
  - "为图标和文字提供适当的间距"
  - "确保在不同主题下都有良好的对比度"
  - "为屏幕阅读器用户提供适当的ARIA标签"

# 反模式
antiPatterns:
  - "不要在单个界面使用过多标签"
  - "不要使用易混淆的颜色组合"
  - "不要为纯装饰性内容添加可选择标签"
  - "不要在移动端使用过小的标签"
  - "不要忽略悬浮和选中状态的视觉反馈"
  - "不要在阅读密集区域使用动画效果"
  - "不要为不可交互的标签添加点击效果"
