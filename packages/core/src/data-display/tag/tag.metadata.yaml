# Tag 组件元数据
# 组件分类系统 v2025.11.03

# 基本信息
name: "Tag"
displayName: "标签"
description: "用于显示分类、状态、属性等信息的可定制标签组件，支持多种颜色、尺寸、变体、可删除和可选择功能"
category: "Data Display"
layer: "component"
stability: "stable"
version: "1.0.0"

# 组件分类
classification:
  - category: "Data Display"
  - subcategory: "Tags & Labels"
  - type: "Component"
  - atomicity: "atom"
  - layer: "component"
  - status: "stable"

# 技术规范
technical:
  react: "^19.0.0"
  typescript: "^5.9.0"
  framework: "React 19"
  styling: "Tailwind CSS 4"
  animation: "Framer Motion 12"
  theme: "七轴主题系统"
  a11y: "WCAG 2.1 AA"

# 功能特性
features:
  primary:
    - "多种颜色主题（7种）"
    - "多种尺寸（5种）"
    - "多种变体（6种）"
    - "多种形状（3种）"
    - "可删除标签"
    - "可选择标签"
    - "自定义图标"
    - "悬浮状态"
    - "选中状态"
    - "禁用状态"
    - "动画支持"
    - "组合使用"
    - "响应式设计"
    - "标签组管理"
    - "溢出处理"
    - "单选/多选模式"

  accessibility:
    - "ARIA标签支持"
    - "键盘导航"
    - "屏幕阅读器优化"
    - "语义化HTML"
    - "可访问性属性"
    - "aria-pressed支持"
    - "可选择状态支持"

  responsive:
    - "自适应尺寸"
    - "移动端优化"
    - "跨设备兼容"
    - "灵活布局"

# API 接口
api:
  props:
    - name: "variant"
      type: "'solid' | 'outline' | 'soft' | 'ghost' | 'gradient' | 'neon'"
      default: "'soft'"
      required: false
      description: "标签的变体样式"

    - name: "color"
      type: "'primary' | 'secondary' | 'success' | 'warning' | 'error' | 'info' | 'gray'"
      default: "'primary'"
      required: false
      description: "标签的颜色主题"

    - name: "size"
      type: "'xs' | 'sm' | 'md' | 'lg' | 'xl'"
      default: "'md'"
      required: false
      description: "标签的尺寸"

    - name: "shape"
      type: "'rounded' | 'pill' | 'square'"
      default: "'rounded'"
      required: false
      description: "标签的形状"

    - name: "removable"
      type: "boolean"
      default: "false"
      required: false
      description: "是否可删除"

    - name: "onRemove"
      type: "() => void"
      default: "undefined"
      required: false
      description: "删除回调函数"

    - name: "icon"
      type: "React.ReactNode"
      default: "undefined"
      required: false
      description: "自定义图标"

    - name: "selectable"
      type: "boolean"
      default: "false"
      required: false
      description: "是否可选择"

    - name: "selected"
      type: "boolean"
      default: "false"
      required: false
      description: "是否已选中"

    - name: "onSelect"
      type: "(selected: boolean) => void"
      default: "undefined"
      required: false
      description: "选择状态变化回调"

    - name: "animated"
      type: "boolean"
      default: "true"
      required: false
      description: "是否显示动画"

    - name: "disabled"
      type: "boolean"
      default: "false"
      required: false
      description: "是否禁用"

    - name: "testId"
      type: "string"
      default: "undefined"
      required: false
      description: "测试ID"

    - name: "children"
      type: "React.ReactNode"
      default: "undefined"
      required: false
      description: "标签内容"

    - name: "className"
      type: "string"
      default: "undefined"
      required: false
      description: "自定义CSS类名"

# TagGroup API
tagGroup:
  api:
    - name: "max"
      type: "number"
      default: "undefined"
      required: false
      description: "最大显示数量"

    - name: "overflowType"
      type: "'ellipsis' | 'dropdown' | 'hidden'"
      default: "'ellipsis'"
      required: false
      description: "溢出处理方式"

    - name: "spacing"
      type: "'tight' | 'normal' | 'loose'"
      default: "'normal'"
      required: false
      description: "标签间距"

    - name: "selectionMode"
      type: "'none' | 'single' | 'multiple'"
      default: "'none'"
      required: false
      description: "选择模式"

    - name: "selectedValues"
      type: "(string | number)[]"
      default: "[]"
      required: false
      description: "选中的标签值"

    - name: "onSelectionChange"
      type: "(selected: (string | number)[]) => void"
      default: "undefined"
      required: false
      description: "选择变化回调"

# 变体系统
variants:
  colors:
    - "primary"
    - "secondary"
    - "success"
    - "warning"
    - "error"
    - "info"
    - "gray"

  sizes:
    - "xs"
    - "sm"
    - "md"
    - "lg"
    - "xl"

  styles:
    - "solid"
    - "outline"
    - "soft"
    - "ghost"
    - "gradient"
    - "neon"

  shapes:
    - "rounded"
    - "pill"
    - "square"

  spacing:
    - "tight"
    - "normal"
    - "loose"

  overflowTypes:
    - "ellipsis"
    - "dropdown"
    - "hidden"

  selectionModes:
    - "none"
    - "single"
    - "multiple"

# 主题系统
theme:
  designTokens:
    - "--bg-primary-action"
    - "--bg-secondary-action"
    - "--bg-secondary"
    - "--bg-tertiary"
    - "--bg-contrast-high"
    - "--text-primary"
    - "--text-secondary"
    - "--text-tertiary"
    - "--text-inverse"
    - "--text-primary-action"
    - "--text-success"
    - "--text-warning"
    - "--text-error"
    - "--text-info"
    - "--border-primary"
    - "--border-primary-action"
    - "--border-secondary"
    - "--border-info"

  sevenAxis:
    mode: "支持"
    hue: "支持"
    saturation: "支持"
    lightness: "支持"
    density: "支持"
    roundness: "支持"
    contrast: "支持"

# 测试覆盖
testing:
  unitTests: true
  integrationTests: true
  visualTests: true
  a11yTests: true
  coverage: "≥ 90%"
  testFiles:
    - "tag.test.tsx"

  testScenarios:
    - "基础渲染"
    - "尺寸变体"
    - "颜色变体"
    - "样式变体"
    - "形状变体"
    - "可删除标签"
    - "可选择标签"
    - "图标支持"
    - "悬浮状态"
    - "选中状态"
    - "禁用状态"
    - "动画效果"
    - "响应式设计"
    - "可访问性"
    - "TagGroup基本功能"
    - "TagGroup溢出处理"
    - "TagGroup选择模式"
    - "组合使用"
    - "边界情况"

# 性能指标
performance:
  bundleSize: "< 3KB (gzipped)"
  renderTime: "< 16ms"
  memoryUsage: "minimal"
  animations: "GPU加速"
  ref: "forwardRef支持"

# 浏览器支持
browsers:
  chrome: "≥ 90"
  firefox: "≥ 88"
  safari: "≥ 14"
  edge: "≥ 90"
  mobileSafari: "≥ 14"
  chromeAndroid: "≥ 90"

# 可访问性
accessibility:
  wcag: "2.1 AA"
  aria: "完整支持"
  keyboard: "支持"
  screenReader: "优化"
  colorContrast: "符合标准"

  ariaRoles:
    - "button" (所有标签)
    - "group" (TagGroup)

  ariaLabels:
    - "标签"
    - "可移除的标签"
    - "已选择"
    - "未选择"

  ariaProperties:
    - "aria-pressed" (可选择标签)
    - "aria-label" (可删除标签)

