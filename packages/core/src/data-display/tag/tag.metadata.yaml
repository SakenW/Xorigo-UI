# 设计规范
design:
  spacing: "基于4px网格系统"
  borderRadius: "继承shape属性"
  typography: "根据size属性自动调整"
  colors: "基于语义化设计令牌"
  animations: "Framer Motion驱动"
  shadows: "选中状态应用ring样式"

  usageGuidelines:
    - "用于标记分类、状态、属性等信息"
    - "可选择标签用于筛选和选择场景"
    - "可删除标签用于临时添加的标记"
    - "TagGroup用于管理多个标签的布局"
    - "选择合适的尺寸匹配上下文"
    - "使用语义化颜色表达状态"

# 常见用例
useCases:
  - "分类标签显示"
  - "状态标记"
  - "属性展示"
