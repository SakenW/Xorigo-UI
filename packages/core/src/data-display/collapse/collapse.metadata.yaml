    new_features:
      - "新增支持控制/非控制模式"
      - "新增支持懒加载模式"
      - "新增支持自定义触发器"
      - "新增支持自定义图标"
      - "新增支持嵌套使用"
      - "新增支持键盘导航"
      - "新增完整的可访问性支持"
      - "新增完整的测试套件"
      - "新增完整的 Storybook 文档"

  to_future:
    planned_features:
      - "支持动画持续时间配置"
      - "支持折叠方向（上/下/左/右）"
      - "支持多个面板同时展开"
      - "支持手势滑动展开"
      - "支持过渡动画自定义"

