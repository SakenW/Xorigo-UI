# 主题适配
theming:
  sevenAxis: true
  lightMode: 完全支持
  darkMode: 完全支持
  customThemes: 完全支持
  recipeSystem: 支持所有配方
  autoAdaptation: 根据趋势自动切换颜色主题

# 最佳实践
bestPractices:
  - 使用趋势数据时，优先提供具体的标签和时间周期
  - 数值格式化使用内置功能，避免自定义函数除非必要
  - 图表数据建议不超过 10 个数据点，保持清晰可读
  - 在仪表盘场景中，使用网格布局并保持卡片尺寸一致
  - 错误状态应该提供明确的错误信息
  - 加载状态应该与实际数据结构匹配
  - 颜色选择应该与数据语义一致（成功用绿色、错误用红色等）
  - 图标选择应该直观表达数据类型

# 常见用例
commonUseCases:
  financial: |
    财务数据展示
    - 收入、支出、利润
    - 带货币符号和千分位
    - 同比增长趋势

  analytics: |
    分析数据展示
    - 用户数、访问量、转化率
    - 带百分比和趋势箭头
    - 周期对比数据

  monitoring: |
    监控数据展示
    - 性能指标、错误率
    - 实时状态和告警
    - 动态图表展示

  kpi: |
    KPI 指标展示
    - 关键业务指标
    - 目标对比
    - 达成率展示

