# =============================================================================
# StatisticCard 组件元数据
# =============================================================================
# 描述统计卡片组件的分类、稳定性、依赖关系等信息
#
# @author Xorigo UI Team
# @version 1.0.0
# @since 2025-11-04
# =============================================================================

# 组件基本信息
component:
  name: StatisticCard
  displayName: 统计卡片
  category: Data Display
  layer: Component
  type: Data Display Component
  description: 高级数据统计展示组件，支持趋势图表、格式化显示、多维度对比

# 分类信息
classification:
  domain: UI Components
  layer: Component Layer
  stability: Stable
  maturity: Production Ready
  version: 1.0.0
  lastUpdated: "2025-11-04"

# 组件层次和依赖
hierarchy:
  atomicLevel: Molecule
  composedOf:
    - StatisticCard (主组件)
  dependsOn:
    primitives:
      - Skeleton
    utils:
      - cva-standalone
      - cn
    system:
      - @xorigo-ui/system (useTheme)
      - @xorigo-ui/theme (CompleteThemeRecipe)
    motion:
      - framer-motion

# 功能特性
features:
  - 多种视觉变体 (default, elevated, filled, gradient, glass, success, warning, error, info)
  - 三种尺寸 (sm, md, lg) 适应不同场景
  - 趋势显示 (上升/下降/持平) 自动颜色编码
  - 数值格式化 (前缀/后缀/货币/千分位/小数位数)
  - 趋势图表 (线形图/柱状图/面积图)
  - 对比数据展示
  - 自定义图标支持 (左侧/右侧/顶部)
  - 加载状态 (骨架屏动画)
  - 错误状态 (错误提示)
  - 动画效果 (基于 Framer Motion)
  - 响应式设计
  - TypeScript 类型安全
  - 可访问性支持 (ARIA 属性)
  - 测试属性支持

# 技术规范
technical:
  framework: React 19
  language: TypeScript 5.9
  styling: Tailwind CSS 4
  animation: Framer Motion 12
  theming: Seven-Axis Theme System
  tokens: DTCG Design Tokens
  ref: forwardRef
  accessibility: WCAG 2.1 AA Compliant

# Props 规范
props:
  # 核心属性
  - name: label
    type: string
    required: true
    description: 统计值标签（如：总收入、用户数）

  - name: value
    type: string | number
    required: true
    description: 统计数值

  # 变体和尺寸
  - name: variant
    type: '"default" | "elevated" | "filled" | "gradient" | "glass" | "success" | "warning" | "error" | "info"'
    required: false
    default: "default"
    description: 卡片视觉变体

  - name: size
    type: '"sm" | "md" | "lg"'
    required: false
    default: "md"
    description: 卡片尺寸

  # 趋势属性
  - name: trend
    type: TrendData
    required: false
    description: 趋势数据
    properties:
      - value: number - 变化百分比
      - direction: "up" | "down" | "neutral" - 变化方向
      - label?: string - 趋势标签
      - period?: string - 时间周期

  # 对比数据
  - name: comparison
    type: ComparisonData
    required: false
    description: 对比数据
    properties:
      - label: string - 对比标签
      - value: string | number - 对比值
      - type?: "increase" | "decrease" | "neutral" - 对比类型

  # 图表属性
  - name: chartData
    type: ChartDataPoint[]
    required: false
    description: 图表数据点数组
    properties:
      - value: number - 数值
      - label?: string - 标签
      - timestamp?: string - 时间戳

  - name: chartType
    type: '"line" | "bar" | "area"'
    required: false
    default: "line"
    description: 图表类型

  # 图标属性
  - name: icon
    type: React.ReactNode
    required: false
    description: 自定义图标

  - name: iconPosition
    type: '"left" | "right" | "top"'
    required: false
    default: "left"
    description: 图标位置

  # 格式化属性
  - name: formatValue
    type: (value: string | number) => string
    required: false
    description: 自定义数值格式化函数

  - name: prefix
    type: string
    required: false
    description: 数值前缀

  - name: suffix
    type: string
    required: false
    description: 数值后缀

  - name: precision
    type: number
    required: false
    description: 精确到小数位数

  - name: noThousandSeparator
    type: boolean
    required: false
    default: false
    description: 禁用千分位分隔符

  - name: currency
    type: string
    required: false
    description: 货币符号（格式化货币时使用）

  # 状态属性
  - name: loading
    type: boolean
    required: false
    default: false
    description: 加载状态

  - name: error
    type: boolean
    required: false
    default: false
    description: 错误状态

  - name: errorMessage
    type: string
    required: false
    default: "数据加载失败"
    description: 错误消息

  # 颜色主题
  - name: colorScheme
    type: '"primary" | "success" | "warning" | "error" | "info"'
    required: false
    description: 颜色主题（自动根据趋势设置）

  # 其他属性
  - name: className
    type: string
    required: false
    description: 自定义样式类

  - name: testId
    type: string
    required: false
    description: 测试ID

# 变体说明
variants:
  - name: default
    description: 默认样式，适合大多数场景
    useCase: 通用数据展示

  - name: elevated
    description: 突出显示，带有更强阴影
    useCase: 重要统计数据展示

  - name: filled
    description: 填充背景色，视觉区分度强
    useCase: 区域分组显示

  - name: gradient
    description: 渐变背景，视觉冲击力强
    useCase: 强调特殊数据

  - name: glass
    description: 玻璃拟态效果，现代感强
    useCase: 现代 UI 设计

  - name: success
    description: 成功状态配色
    useCase: 正面数据展示（增长、成功等）

  - name: warning
    description: 警告状态配色
    useCase: 需要注意的数据（预警等）

  - name: error
    description: 错误状态配色
    useCase: 负面数据展示（下降、错误等）

  - name: info
    description: 信息状态配色
    useCase: 中性信息展示

# 尺寸说明
sizes:
  - name: sm
    description: 小尺寸，紧凑布局
    padding: 1rem (16px)
    valueFontSize: text-2xl
    useCase: 空间受限场景

  - name: md
    description: 中尺寸，标准布局
    padding: 1.5rem (24px)
    valueFontSize: text-3xl
    useCase: 默认选择，平衡空间与可读性

  - name: lg
    description: 大尺寸，宽松布局
    padding: 2rem (32px)
    valueFontSize: text-4xl
    useCase: 强调数据、宽敞空间

# 图表类型
chartTypes:
  - name: line
    description: 线形图，展示趋势变化
    useCase: 时间序列数据

  - name: bar
    description: 柱状图，对比数值大小
    useCase: 分类数据对比

  - name: area
    description: 面积图，强调累积效果
    useCase: 累积数据展示

# 图标位置
iconPositions:
  - name: left
    description: 左侧图标
    useCase: 默认选择，符合阅读习惯

  - name: right
    description: 右侧图标
    useCase: 节省垂直空间

  - name: top
    description: 顶部图标
    useCase: 强调视觉元素

# 使用场景
useCases:
  - 数据仪表盘卡片
  - 财务数据展示
  - KPI 指标卡片
  - 业务增长统计
  - 用户行为数据
  - 销售业绩展示
  - 网站流量统计
  - 转化率监控
  - 实时数据面板
  - 定期报表展示
  - 对比分析卡片
  - 趋势预测展示

# 格式化示例
formattingExamples:
  currency: "￥1,234,567" - 带货币符号
  percentage: "85.5%" - 带百分号
  precision: "85.55" - 保留两位小数
  noSeparator: "1234567" - 禁用千分位
  custom: "格式化: 1234567" - 自定义函数

# 可访问性
accessibility:
  wcagLevel: AA
  keyboardNavigation: true
  screenReaderSupport: true
  ariaRoles:
    - role="alert" (错误状态)
  ariaAttributes:
    - aria-label (统计标签)
    - aria-valuenow (当前值)
    - aria-valuetrend (趋势)
  focusManagement: 支持 Tab 键导航
  colorContrast: 符合 WCAG AA 标准

# 性能
performance:
  bundleSize: ~4.5KB (gzipped)
  renderPerformance: 优化了重渲染
  memoization: 使用 React.useMemo 优化计算
  lazyLoading: 支持图表数据懒加载
  animationPerformance: 使用 Framer Motion 优化动画

# 浏览器支持
browserSupport:
  - Chrome >= 88
  - Firefox >= 85
  - Safari >= 14
  - Edge >= 88
  - iOS Safari >= 14
  - Android Chrome >= 88

# 测试覆盖
testing:
  unitTests: 完整覆盖
  integrationTests: 已实现
  e2eTests: 建议添加
  a11yTests: 已实现
  visualTests: Storybook 已实现
  coverage: > 90%

# 示例代码
examples:
  basic: |
    <StatisticCard
      label="总收入"
      value="￥1,234,567"
    />

  withTrend: |
    <StatisticCard
      label="总收入"
      value="￥1,234,567"
      trend={{
        value: 12,
        direction: 'up',
        label: '较上月'
      }}
    />

  withFormat: |
    <StatisticCard
      label="转化率"
      value={85.5}
      suffix="%"
      precision={1}
    />

  withChart: |
    <StatisticCard
      label="月度收入"
      value="￥1,234,567"
      chartData={[
        { value: 10, label: '1月' },
        { value: 15, label: '2月' },
        { value: 12, label: '3月' }
      ]}
      chartType="line"
    />

  complete: |
    <StatisticCard
      label="月度总收入"
      value={1234567}
      prefix="￥"
      precision={0}
      trend={{
        value: 12,
        direction: 'up',
        label: '较上月'
      }}
      comparison={{
        label: '上月',
        value: 1000000,
        type: 'increase'
      }}
      chartData={data}
      chartType="line"
      icon={<Icon />}
    />

  dashboard: |
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '20px' }}>
      <StatisticCard variant="success" label="总收入" value={2456789} prefix="￥" trend={{ value: 15.8, direction: 'up', label: '较上月' }} />
      <StatisticCard variant="info" label="活跃用户" value={12345} suffix="人" trend={{ value: 8.3, direction: 'up', label: '较上周' }} />
      <StatisticCard variant="warning" label="转化率" value={85.5} suffix="%" precision={1} trend={{ value: 3.2, direction: 'up', label: '较昨日' }} />
      <StatisticCard variant="error" label="跳出率" value={23.5} suffix="%" precision={1} trend={{ value: 2.1, direction: 'down', label: '较昨日' }} />
    </div>

