# Autocomplete Component Metadata

name: "Autocomplete"
displayName: "Autocomplete"
category: "inputs"
layer: "Component Layer"
level: "component"
stability: "stable"
version: "1.0.0"
since: "v1.5.0"

description: |
  自动完成组件，提供智能搜索和过滤功能，支持键盘导航和自定义渲染

tags:
  - inputs
  - autocomplete
  - search
  - select

props:
  - name: "options"
    type: "AutocompleteOption[]"
    required: true
    description: "选项列表"
  - name: "value"
    type: "string"
    required: false
    description: "当前值（受控）"
  - name: "defaultValue"
    type: "string"
    required: false
    default: "\"\""
    description: "默认值（非受控）"
  - name: "onValueChange"
    type: "(value: string) => void"
    required: false
    description: "值变化回调"
  - name: "onInputChange"
    type: "(value: string) => void"
    required: false
    description: "输入变化回调"
  - name: "placeholder"
    type: "string"
    required: false
    default: "\"输入搜索...\""
    description: "占位符文本"
  - name: "disabled"
    type: "boolean"
    required: false
    default: "false"
    description: "是否禁用"
  - name: "loading"
    type: "boolean"
    required: false
    default: "false"
    description: "是否加载中"
  - name: "size"
    type: "'sm' | 'md' | 'lg'"
    required: false
    default: "\"md\""
    description: "尺寸"
  - name: "clearable"
    type: "boolean"
    required: false
    default: "false"
    description: "是否可清除"

features:
  - 智能搜索和过滤
  - 键盘导航支持
  - 自定义选项渲染
  - 加载状态
  - 禁用状态
  - 尺寸和变体

accessibility:
  - ARIA combobox role
  - ARIA listbox role
  - ARIA option role
  - 键盘导航支持
  - Focus 管理
