# 相关组件
related:
  siblings:
    - "ErrorMessage: 字段级错误消息"
    - "ValidationSummary: 校验汇总"
    - "HelperText: 帮助文本"
    - "FormProvider: 表单提供者"

  parents:
    - "Form: 表单容器"
    - "FormField: 表单字段"
    - "FormLayout: 表单布局"

  dependencies:
    - "cva-standalone: 变体样式"
    - "framer-motion: 动画"
    - "lucide-react: 图标"

