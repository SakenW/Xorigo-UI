# FormProvider 组件元数据
# 符合 v2025.11.03 SSOT 规范

metadata:
  # 基本信息
  name: FormProvider
  displayName: Form Provider
  category: forms
  subcategory: 表单结构与校验
  layer: component
  version: 1.0.0
  stability: stable

  # 分类信息
  classification:
    category: forms
    layer: component
    type: provider
    purpose: 表单状态管理和验证上下文

  # 功能特性
  features:
    - 表单上下文提供者
    - 完整的状态管理（values、errors、touched、validating）
    - 字段验证（同步/异步）
    - 表单提交处理
    - 表单重置功能
    - 嵌套表单支持
    - 动态字段管理
    - 外部状态变更回调
    - 禁用和只读状态管理
    - TypeScript 类型安全
    - React Context API
    - 可访问性支持

  # 技术特性
  technical:
    react: ^19.0.0
    typescript: ^5.0.0
    dependencies:
      - react
      - react-dom
      - @xorigo-ui/core
    peerDependencies: []
    builtWith:
      - React Context API
      - React Hooks (useState, useCallback, useMemo, useEffect)
      - CVA (Class Variance Authority)
      - TypeScript Generics

  # API 设计
  api:
    props:
      - name: initialValues
        type: FormValue
        required: false
        default: '{}'
        description: 表单初始值
        notes: 支持嵌套对象和数组

      - name: initialErrors
        type: FormError
        required: false
        default: '{}'
        description: 表单初始错误

      - name: initialTouched
        type: FormTouched
        required: false
        default: '{}'
        description: 表单初始触摸状态

      - name: onSubmit
        type: '(values: TValues, helpers: FormHelpers<TValues>) => void | Promise<void>'
        required: false
        description: 表单提交回调函数
        notes: 支持异步提交

      - name: onValuesChange
        type: '(values: TValues) => void'
        required: false
        description: 值变化回调

      - name: onErrorsChange
        type: '(errors: FormError) => void'
        required: false
        description: 错误变化回调

      - name: onTouchedChange
        type: '(touched: FormTouched) => void'
        required: false
        description: 触摸状态变化回调

      - name: validate
        type: '(values: TValues) => FormError | Promise<FormError>'
        required: false
        description: 验证函数
        notes: 支持同步和异步验证

      - name: disabled
        type: boolean
        required: false
        default: false
        description: 禁用整个表单

      - name: readonly
        type: boolean
        required: false
        default: false
        description: 只读模式

      - name: validateOnChange
        type: boolean
        required: false
        default: true
        description: 值变化时是否自动验证

      - name: validateOnBlur
        type: boolean
        required: false
        default: true
        description: 失焦时是否自动验证

      - name: enableReinitialize
        type: boolean
        required: false
        default: false
        description: 初始值变化时是否重新初始化

    context:
      - name: useForm
        type: '() => FormContextValue<TValues>'
        description: 获取表单上下文
        notes: 必须在 FormProvider 内使用

    methods:
      - name: setFieldValue
        signature: '(name: string, value: any) => void'
        description: 设置单个字段值

      - name: setFieldError
        signature: '(name: string, error: string | string[] | undefined) => void'
        description: 设置单个字段错误

      - name: setFieldTouched
        signature: '(name: string, touched: boolean) => void'
        description: 设置字段触摸状态

      - name: setFieldValidating
        signature: '(name: string, validating: boolean) => void'
        description: 设置字段验证状态

      - name: setValues
        signature: '(values: TValues) => void'
        description: 设置多个字段值

      - name: setErrors
        signature: '(errors: FormError) => void'
        description: 设置多个字段错误

      - name: setTouched
        signature: '(touched: FormTouched) => void'
        description: 设置多个字段触摸状态

      - name: validateField
        signature: '(name: string) => Promise<boolean>'
        description: 验证单个字段

      - name: validateForm
        signature: '() => Promise<boolean>'
        description: 验证整个表单

      - name: resetForm
        signature: '() => void'
        description: 重置表单到初始状态

      - name: setSubmitting
        signature: '(isSubmitting: boolean) => void'
        description: 设置提交状态

      - name: handleSubmit
        signature: '(onSubmit: Function) => (e?: React.FormEvent) => void'
        description: 生成提交处理函数

      - name: handleReset
        signature: '() => void'
        description: 生成重置处理函数

      - name: getFieldProps
        signature: '(name: string) => FieldProps'
        description: 获取字段属性
        notes: 便于手动绑定字段

  # 状态
  state:
    values: 表单值对象
    errors: 表单错误对象
    touched: 字段触摸状态
    validating: 字段验证状态
    disabled: 禁用状态
    readonly: 只读状态
    isSubmitting: 提交中状态
    isValidating: 验证中状态
    isValid: 是否有效
    isDirty: 是否已修改

  # 使用场景
  useCases:
    - 表单状态管理
    - 多步骤表单
    - 动态表单字段
    - 复杂验证逻辑
    - 表单数据同步
    - 与第三方表单库集成

  # 最佳实践
  bestPractices:
    - 使用 useForm Hook 获取表单上下文
    - 通过 validate 函数定义验证逻辑
    - 使用 validateOnChange/validateOnBlur 控制验证时机
    - 利用 getFieldProps 简化字段绑定
    - 使用 enableReinitialize 处理动态初始值
    - 合理使用 disabled 和 readonly 状态

  # 注意事项
 注意事项:
    - 必须在 FormProvider 内部使用 useForm
    - 嵌套对象使用点号路径（如 'user.name'）
    - 验证函数应返回错误对象或 Promise
    - 提交处理会自动标记所有字段为已触摸
    - 禁用状态下无法提交表单
    - 重置会清除所有状态包括验证状态

  # 示例代码
  examples:
    basic:
      description: 基本用法
      code: |
        <FormProvider initialValues={{ name: '', email: '' }}>
          <MyForm />
        </FormProvider>

    withValidation:
      description: 带验证的表单
      code: |
        const validate = (values) => {
          const errors = {}
          if (!values.email) {
            errors.email = 'Required'
          }
          return errors
        }

        <FormProvider validate={validate}>
          <MyForm />
        </FormProvider>

    nested:
      description: 嵌套表单
      code: |
        <FormProvider initialValues={{ user: { name: '', email: '' } }}>
          <MyForm />
        </FormProvider>

    dynamicFields:
      description: 动态字段
      code: |
        const { setFieldValue } = useForm()

        // 添加字段
        setFieldValue('items', [...items, newItem])

        // 删除字段
        setFieldValue('items', items.filter(item => item.id !== id))

  # 相关组件
  relatedComponents:
    - Form: 表单容器组件
    - FormField: 字段容器组件
    - Fieldset: 字段集组件
    - ValidationMessage: 验证消息组件
    - InputGroup: 输入组组件
    - ButtonGroup: 按钮组组件

  # 设计原则
  designPrinciples:
    - 职责分离：Provider 管理状态，字段组件消费状态
    - 类型安全：完整的 TypeScript 类型支持
    - 灵活性：支持复杂的数据结构和验证逻辑
    - 可组合：与现有表单组件无缝集成
    - 可扩展：通过回调函数支持外部状态同步

  # 架构对齐
  architecture:
    ssotVersion: v2025.11.03
    taxonomyCategory: forms
    layer: Component Layer
    dependencyLevel: 3
    dependencies:
      - primitives
      - system
      - foundations
    providesTo:
      - form
      - form-field
      - form-fieldset
      - validation-message
      - inputs

  # 性能
  performance:
    memoization: 使用 useMemo 和 useCallback 优化渲染
    reRenderStrategy: 局部状态更新，最小化重渲染
    memoryManagement: 自动清理验证状态

  # 可访问性
  accessibility:
    role: form
    keyboardNavigation: 支持
    screenReader: 语义化属性
    ariaSupport: 完整支持

  # 测试
  testing:
    unitTests: form-provider.test.tsx
    integrationTests: 集成测试覆盖
    e2eTests: 端到端测试
    coverage: >90%
    testCases:
      - 基本功能测试
      - 状态管理测试
      - 验证逻辑测试
      - 表单操作测试
      - 错误边界测试
      - React Hook Form 兼容性测试
      - 无障碍访问测试

  # 文档
  documentation:
    readme: form-provider.md
    api: form-provider.api.md
    stories: form-provider.stories.tsx
    examples: examples/

  # 版本历史
  changelog:
    - version: 1.0.0
      date: 2025-11-04
      changes:
        - 初始版本
        - 实现表单上下文提供者
        - 支持字段验证和管理
        - 支持嵌套表单和动态字段
        - 完整的 TypeScript 类型支持
        - 全面的单元测试覆盖

  # 维护信息
  maintenance:
    owner: Xorigo UI Team
    reviewers:
      - Component Team
    updateFrequency: 根据需要
    breakingChanges: 遵循语义化版本

  # 许可
  license: MIT
