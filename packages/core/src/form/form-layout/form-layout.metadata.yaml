    - formGroupVariants
    - sectionHeaderVariants

# File Structure
fileStructure:
  source: "packages/core/src/form/form-layout/form-layout.tsx"
  test: "packages/core/src/form/form-layout/form-layout.test.tsx"
  story: "packages/core/src/form/form-layout/form-layout.stories.tsx"
  metadata: "packages/core/src/form/form-layout/form-layout.metadata.yaml"
