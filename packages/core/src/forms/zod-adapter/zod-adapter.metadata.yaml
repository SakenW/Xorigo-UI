# ZodAdapter 组件元数据
# Component Metadata for ZodAdapter

# 基础信息 (Basic Information)
name: ZodAdapter
displayName: Zod 验证适配器
version: 1.0.0
stability: stable
category: forms
layer: component

# 功能标签 (Feature Tags)
tags:
  - validation
  - zod
  - form
  - schema
  - typescript
  - adapter
  - realtime-validation
  - async-validation
  - field-validation
  - custom-error-messages
  - validation-timing
  - conditional-validation
  - array-validation
  - nested-object-validation
  - type-inference
  - error-formatting
  - accessibility

# 架构信息 (Architecture Information)
architecture:
  ssot_version: "v2025.11.03"
  component_layer: true
  dependency_level: 4
  dependencies:
    - primitives
    - utils
    - forms
    - zod

# 组件特性 (Component Features)
features:
  core:
    - name: "Zod 模式验证适配器"
      description: "将 Zod 验证与 Xorigo UI 组件无缝集成"
      status: stable

    - name: "实时验证"
      description: "支持 onChange 和 onBlur 实时验证"
      status: stable

    - name: "异步验证"
      description: "支持异步验证函数和远程验证"
      status: stable

    - name: "字段级验证"
      description: "支持单个字段的独立验证"
      status: stable

    - name: "自定义错误消息"
      description: "支持自定义验证错误消息"
      status: stable

    - name: "验证时机控制"
      description: "可控制验证触发时机 (onChange/onBlur/onSubmit)"
      status: stable

    - name: "条件验证"
      description: "支持基于其他字段值的条件验证"
      status: stable

    - name: "数组验证"
      description: "支持数组类型字段的验证"
      status: stable

    - name: "嵌套对象验证"
      description: "支持嵌套对象的深度验证"
      status: stable

    - name: "类型推断"
      description: "基于 Zod 模式自动推断 TypeScript 类型"
      status: stable

    - name: "错误格式化"
      description: "将 ZodError 转换为字段错误对象"
      status: stable

    - name: "TypeScript 类型安全"
      description: "提供完整的 TypeScript 类型支持"
      status: stable

    - name: "Zod 深度集成"
      description: "深度集成 Zod 库的所有功能"
      status: stable

    - name: "可访问性支持"
      description: "提供 ARIA 属性和键盘导航支持"
      status: stable

# 变体配置 (Variant Configuration)
variants:
  - name: "default"
    description: "默认变体，带背景和间距"
    status: stable

  - name: "minimal"
    description: "简洁变体，无背景，紧密间距"
    status: stable

  - name: "bordered"
    description: "边框变体，带边框和内边距"
    status: stable

# 尺寸配置 (Size Configuration)
sizes:
  - name: "sm"
    description: "小尺寸"
    status: stable

  - name: "md"
    description: "中等尺寸（默认）"
    status: stable

  - name: "lg"
    description: "大尺寸"
    status: stable

  - name: "xl"
    description: "特大尺寸"
    status: stable

# 主题适配 (Theme Integration)
theme_integration:
  supported: true
  seven_axis_compatible: true
  token_usage:
    - color
    - spacing
    - typography
    - border
    - shadow
  auto_adaptation: true

# API 配置 (API Configuration)
api:
  props:
    required:
      - schema

    optional:
      - initialValues
      - validateOnChange
      - validateOnBlur
      - showSubmitButton
      - showResetButton
      - submitButtonLabel
      - resetButtonLabel
      - showSubmittingState
      - showValidationErrors
      - enableReinitialize
      - onSubmit
      - onReset
      - adapterDisabled
      - adapterReadonly
      - variant
      - size
      - disabled
      - className
      - children

  context:
    - useZodAdapter
    - getFieldProps
    - validateField
    - validateForm
    - setFieldValue
    - setFieldTouched
    - resetForm

  hooks:
    - useZodField
    - useZodForm
    - useZodSubmit
    - useZodReset

# 事件处理 (Event Handling)
events:
  - name: "onSubmit"
    description: "表单提交时触发"
    payload: "values: T, context: ZodAdapterContextValue"

  - name: "onReset"
    description: "表单重置时触发"
    payload: "void"

# 可访问性 (Accessibility)
accessibility:
  aria_support: true
  keyboard_navigation: true
  screen_reader: true
  role: "form"
  attributes:
    - aria-busy
    - aria-invalid
    - aria-describedby

# 性能优化 (Performance Optimization)
performance:
  lazy_validation: true
  debounce_validation: true
  memoization: true
  re_renders: optimized

# 测试覆盖 (Test Coverage)
testing:
  unit_tests: true
  integration_tests: true
  accessibility_tests: true
  visual_tests: true
  coverage_target: "> 90%"

# 文档示例 (Documentation Examples)
examples:
  basic:
    - name: "基础用法"
      description: "展示基本的 ZodAdapter 使用方式"
      code_snippet: true

  variants:
    - name: "变体示例"
      description: "展示不同变体的使用"
      code_snippet: true

  sizes:
    - name: "尺寸示例"
      description: "展示不同尺寸的使用"
      code_snippet: true

  async:
    - name: "异步验证"
      description: "展示异步验证的使用"
      code_snippet: true

  conditional:
    - name: "条件验证"
      description: "展示条件验证的使用"
      code_snippet: true

  array:
    - name: "数组验证"
      description: "展示数组字段的验证"
      code_snippet: true

  context:
    - name: "Context 使用"
      description: "展示如何使用表单 Context"
      code_snippet: true

  custom:
    - name: "自定义按钮"
      description: "展示自定义提交和重置按钮"
      code_snippet: true

# 使用场景 (Use Cases)
use_cases:
  - "用户注册表单验证"
  - "产品信息表单验证"
  - "联系表单验证"
  - "复杂表单数据验证"
  - "类型安全的表单处理"
  - "实时输入校验"
  - "异步验证需求"
  - "嵌套对象验证"
  - "数组字段验证"
  - "条件依赖验证"

# 最佳实践 (Best Practices)
best_practices:
  - "使用 TypeScript 泛型确保类型安全"
  - "在 onChange 和 onBlur 之间选择合适的验证时机"
  - "为复杂验证创建自定义 Zod 模式"
  - "使用 Context API 访问表单状态"
  - "提供有意义的自定义错误消息"
  - "在提交前验证整个表单"
  - "使用 useZodField 钩子获取字段属性"
  - "启用 enableReinitialize 以支持动态初始值"
  - "利用 Zod 的类型推断减少类型定义"
  - "为异步验证添加适当的加载状态"

# 相关组件 (Related Components)
related_components:
  - name: "FormikAdapter"
    relationship: "similar"
    description: "Formik 表单适配器"

  - name: "FormProvider"
    relationship: "complementary"
    description: "表单提供者"

  - name: "Form"
    relationship: "complementary"
    description: "表单容器"

  - name: "FormField"
    relationship: "complementary"
    description: "字段容器"

  - name: "FormItem"
    relationship: "complementary"
    description: "表单项容器"

  - name: "ErrorMessage"
    relationship: "complementary"
    description: "错误消息显示"

  - name: "ValidationMessage"
    relationship: "complementary"
    description: "验证消息显示"

# 版本历史 (Version History)
changelog:
  - version: "1.0.0"
    date: "2025-11-04"
    changes:
      - "初始版本发布"
      - "实现 Zod 验证适配器功能"
      - "支持 3 种变体和 4 种尺寸"
      - "提供完整的 TypeScript 类型支持"
      - "集成可访问性支持"
      - "包含完整的测试套件"
      - "提供 Storybook 故事示例"

# 维护信息 (Maintenance Information)
maintenance:
  owner: "Xorigo UI Team"
  created_date: "2025-11-04"
  last_updated: "2025-11-04"
  next_review: "2026-11-04"

# 许可证 (License)
license: "MIT"

# 兼容性 (Compatibility)
compatibility:
  react: "^18.0.0 || ^19.0.0"
  typescript: "~5.9.3"
  zod: "^3.0.0"

# 导出信息 (Export Information)
exports:
  components:
    - "ZodAdapter"

  hooks:
    - "useZodAdapter"
    - "useZodField"
    - "useZodForm"
    - "useZodSubmit"
    - "useZodReset"

  types:
    - "ZodAdapterProps"
    - "ZodAdapterContextValue"

  utilities:
    - "zodAdapterVariants"
    - "formContentVariants"
    - "submitButtonVariants"
    - "resetButtonVariants"
    - "createZodValidationRule"
    - "createAsyncZodValidator"
    - "createRequiredValidator"
    - "createEmailValidator"
    - "createMinLengthValidator"
    - "createMaxLengthValidator"

  constants:
    - "ZOD_ADAPTER_VARIANTS"
    - "ZOD_ADAPTER_SIZES"
    - "ZOD_ADAPTER_DEFAULTS"

# 性能指标 (Performance Metrics)
performance_metrics:
  bundle_size:
    minified: "< 15KB"
    gzipped: "< 5KB"

  render_time:
    initial: "< 16ms"
    update: "< 8ms"

  validation_time:
    field: "< 5ms"
    form: "< 20ms"
    async: "< 100ms"

# 浏览器支持 (Browser Support)
browser_support:
  chrome: ">= 88"
  firefox: ">= 85"
  safari: ">= 14"
  edge: ">= 88"

# 状态 (Status)
status:
  development: complete
  testing: complete
  documentation: complete
  ready_for_production: true
  deprecated: false
