# ============================================================================
# 贡献指南
# ============================================================================

contributing:
  guideline: /CONTRIBUTING.md
  codeStyle: /docs/guidelines/code-style.md
  commitMessage: /docs/guidelines/commit-message.md
  pullRequest: /docs/development/pull-request.md

