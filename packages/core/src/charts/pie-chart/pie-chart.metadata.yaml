    date: 2025-11-04
    changes:
      - 初始版本发布
      - 支持4种饼图变体
      - 完整的TypeScript类型支持
      - Framer Motion动画集成
      - 七轴主题系统集成
      - 完整的测试套件
      - Storybook故事文件

# ============================================================================
# 作者信息
# ============================================================================

authors:
  - name: Xorigo UI Team
    email: team@xorigo-ui.com
    role: 组件维护者

# ============================================================================
# 许可证
# ============================================================================

