# ============================================================================
# Examples
# ============================================================================

examples:
  basic:
    title: "Basic Line Chart"
    description: "Simple line chart with one data series"
    code: |
      import { LineChart } from '@xorigo-ui/core';

      const data = [
        {
          id: 'series-1',
          name: 'Revenue',
          data: [
            { x: 'Jan', y: 4000 },
            { x: 'Feb', y: 3000 },
            { x: 'Mar', y: 5000 }
          ],
          smooth: true
        }
      ];

      <LineChart series={data} />

  comparison:
    title: "Multi-Series Comparison"
    description: "Compare multiple data series with area fills"
    code: |
      import { LineChart } from '@xorigo-ui/core';

      const data = [
        {
          id: 'revenue',
          name: 'Revenue',
          data: [...],
          area: { enabled: true },
          smooth: true
        },
        {
          id: 'expenses',
          name: 'Expenses',
          data: [...],
          area: { enabled: true }
        }
      ];

      <LineChart
        series={data}
        width={800}
        height={400}
        legend={{ enabled: true }}
      />

  step_chart:
    title: "Step Line Chart"
    description: "Create step charts for discrete data"
    code: |
      import { LineChart } from '@xorigo-ui/core';

      <LineChart
        series={[{
          id: 'discrete',
          name: 'Discrete Data',
          data: [...],
          step: true,
          points: { enabled: true }
        }]}
      />

  interactive:
    title: "Interactive Chart"
    description: "Chart with tooltips and zoom"
    code: |
      import { LineChart } from '@xorigo-ui/core';

      <LineChart
        series={data}
        tooltip={{ enabled: true }}
        zoom={{ enabled: true }}
        onDataPointClick={(data) => console.log('Clicked:', data)}
      />

