# LineChart Component Metadata
# Generated by Xorigo UI Component System

metadata_version: "1.0.0"
component_name: "LineChart"
component_path: "/packages/core/src/charts/line-chart/line-chart.tsx"

# ============================================================================
# Classification
# ============================================================================

classification:
  category: "Charts"
  layer: "component"
  stability: "stable"
  version: "1.0.0"
  bundle_size:
    minified: "~15KB"
    gzipped: "~5KB"

# ============================================================================
# Description
# ============================================================================

description:
  short: "Flexible and animated line chart component for time-series data visualization"
  long: |
    The LineChart component provides a comprehensive solution for displaying line charts
    with support for multiple data series, smooth curves, area fills, data points,
    interactive tooltips, zoom functionality, and full theme integration. Built on
    React 19 with TypeScript, it offers excellent type safety and developer experience.

    Key features include:
    - Multiple data series comparison
    - Smooth curve and step line interpolation
    - Area fills with customizable opacity
    - Interactive data points with hover effects
    - Configurable grid system
    - Customizable axes with labels and tick formatting
    - Automatic legend generation
    - Hover tooltips with detailed information
    - Mouse wheel zoom and pan
    - Framer Motion animations
    - Full seven-axis theme integration
    - Accessibility compliance (ARIA labels, screen reader support)

    Perfect for dashboards, analytics, reporting, and any data visualization needs.

# ============================================================================
# Props API
# ============================================================================

props:
  required:
    - series:
        type: "DataSeries[]"
        description: "Array of data series to display"
        example: |
          [
            {
              id: 'series-1',
              name: 'Revenue',
              data: [
                { x: 'Jan', y: 4000 },
                { x: 'Feb', y: 3000 }
              ],
              color: 'hsl(var(--chart-1))',
              smooth: true
            }
          ]

  optional:
    width:
      type: "number"
      default: 800
      description: "Chart width in pixels"
      range: "100 - 5000"

    height:
      type: "number"
      default: 400
      description: "Chart height in pixels"
      range: "100 - 5000"

    margin:
      type: "{ top?: number; right?: number; bottom?: number; left?: number }"
      default: "{ top: 20, right: 30, bottom: 40, left: 50 }"
      description: "Margin around the chart"
      example: "{ top: 10, right: 20, bottom: 30, left: 40 }"

    grid:
      type: "GridConfig"
      default: "{ enabled: true }"
      description: "Grid configuration"
      example: |
        {
          enabled: true,
          x: { enabled: true, tickCount: 5 },
          y: { enabled: true, tickCount: 5 },
          color: 'hsl(var(--muted))',
          opacity: 0.1
        }

    axis:
      type: "AxisConfig"
      default: |
        {
          x: { enabled: true, tickCount: 5 },
          y: { enabled: true, tickCount: 5 }
        }
      description: "Axis configuration"
      example: |
        {
          x: {
            enabled: true,
            tickCount: 5,
            tickFormat: (value) => value.toFixed(0),
            label: 'Time Period',
            labelOffset: 20
          },
          y: {
            enabled: true,
            tickCount: 5,
            tickFormat: (value) => `$${value}`,
            label: 'Revenue ($)',
            labelOffset: 30
          }
        }

    legend:
      type: "LegendConfig"
      default: "{ enabled: true, position: 'top', align: 'center' }"
      description: "Legend configuration"
      example: |
        {
          enabled: true,
          position: 'right',
          align: 'start'
        }

    tooltip:
      type: "TooltipConfig"
      default: "{ enabled: true, followCursor: false }"
      description: "Tooltip configuration"
      example: |
        {
          enabled: true,
          followCursor: false,
          showValue: true,
          showSeries: true,
          offset: 10
        }

    zoom:
      type: "ZoomConfig"
      default: "{ enabled: false }"
      description: "Zoom configuration"
      example: |
        {
          enabled: true,
          mode: 'x',
          minZoom: 0.5,
          maxZoom: 5
        }

    animate:
      type: "boolean"
      default: true
      description: "Enable/disable animations"

    animationDuration:
      type: "number"
      default: 1500
      description: "Animation duration in milliseconds"

    colors:
      type: "string[]"
      default: "DEFAULT_COLORS"
      description: "Custom color palette"
      example: "['#FF6B6B', '#4ECDC4', '#45B7D1']"

    className:
      type: "string"
      default: undefined
      description: "Additional CSS class name"

    children:
      type: "React.ReactNode"
      default: undefined
      description: "Custom children overlay (rendered as SVG group)"

    onDataPointClick:
      type: "(data: DataPoint & { seriesId: string }) => void"
      default: undefined
      description: "Callback fired when data point is clicked"
      signature: "(data) => void"

    onDataPointHover:
      type: "(data: DataPoint & { seriesId: string } | null) => void"
      default: undefined
      description: "Callback fired when hovering over data point"
      signature: "(data) => void"

# ============================================================================
# Type Definitions
# ============================================================================

types:
  DataPoint:
    description: "Single data point in a series"
    properties:
      x:
        type: "number | string | Date"
        description: "X-axis value"
      y:
        type: "number"
        description: "Y-axis value"
      label:
        type: "string"
        description: "Optional label for the point"
        required: false
      metadata:
        type: "Record<string, any>"
        description: "Additional metadata"
        required: false

  DataSeries:
    description: "A data series displayed as a line"
    properties:
      id:
        type: "string"
        description: "Unique identifier for the series"
      name:
        type: "string"
        description: "Display name for the legend"
      data:
        type: "DataPoint[]"
        description: "Array of data points"
      color:
        type: "string"
        description: "Line color (CSS color value)"
        required: false
      strokeWidth:
        type: "number"
        description: "Line thickness in pixels"
        required: false
      strokeDasharray:
        type: "string"
        description: "Dash pattern for the line"
        required: false
      area:
        type: |
          {
            enabled: boolean;
            fillOpacity?: number;
          }
        description: "Area fill configuration"
        required: false
      points:
        type: |
          {
            enabled: boolean;
            radius?: number;
            hoverRadius?: number;
          }
        description: "Data point configuration"
        required: false
      smooth:
        type: "boolean"
        description: "Use smooth curve interpolation"
        required: false
      step:
        type: "boolean"
        description: "Use step line interpolation"
        required: false

  GridConfig:
    description: "Grid line configuration"
    properties:
      enabled:
        type: "boolean"
        description: "Enable/disable grid"
      x:
        type: "{ enabled: boolean; tickCount?: number }"
        description: "X-axis grid configuration"
        required: false
      y:
        type: "{ enabled: boolean; tickCount?: number }"
        description: "Y-axis grid configuration"
        required: false
      color:
        type: "string"
        description: "Grid line color"
        required: false
      opacity:
        type: "number"
        description: "Grid line opacity (0-1)"
        required: false

  AxisConfig:
    description: "Axis configuration"
    properties:
      x:
        type: |
          {
            enabled: boolean;
            tickCount?: number;
            tickFormat?: (value: any) => string;
            label?: string;
            labelOffset?: number;
          }
        description: "X-axis configuration"
      y:
        type: |
          {
            enabled: boolean;
            tickCount?: number;
            tickFormat?: (value: number) => string;
            label?: string;
            labelOffset?: number;
          }
        description: "Y-axis configuration"

  LegendConfig:
    description: "Legend configuration"
    properties:
      enabled:
        type: "boolean"
        description: "Enable/disable legend"
      position:
        type: "'top' | 'right' | 'bottom' | 'left'"
        description: "Legend position"
        required: false
      align:
        type: "'start' | 'center' | 'end'"
        description: "Legend alignment"
        required: false

  TooltipConfig:
    description: "Tooltip configuration"
    properties:
      enabled:
        type: "boolean"
        description: "Enable/disable tooltips"
      followCursor:
        type: "boolean"
        description: "Follow mouse cursor"
        required: false
      showValue:
        type: "boolean"
        description: "Display value in tooltip"
        required: false
      showSeries:
        type: "boolean"
        description: "Display series name in tooltip"
        required: false
      offset:
        type: "number"
        description: "Tooltip offset in pixels"
        required: false

  ZoomConfig:
    description: "Zoom configuration"
    properties:
      enabled:
        type: "boolean"
        description: "Enable/disable zoom"
      mode:
        type: "'x' | 'y' | 'xy'"
        description: "Zoom mode"
        required: false
      minZoom:
        type: "number"
        description: "Minimum zoom level"
        required: false
      maxZoom:
        type: "number"
        description: "Maximum zoom level"
        required: false

