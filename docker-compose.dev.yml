version: '3.8'

services:
  xorigo-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: xorigo-ui-dev
    ports:
      - "3100:3100"  # Next.js dev server port
    volumes:
      - ./src:/app/src
      - ./demo-site:/app/demo-site
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./vite.config.demo.ts:/app/vite.config.demo.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./package.json:/app/package.json
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - xorigo-ui-network

networks:
  xorigo-ui-network:
    driver: bridge
